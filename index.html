
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>AI SLOPE — Everything AI. One Powerful Workspace.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%23a855f7'/></linearGradient></defs><path d='M20 80 L50 20 L80 80 L65 80 L50 48 L35 80 Z' fill='url(%23g)'/></svg>">
<style>
/* ============================================================
   AI SLOPE — Design System
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080d; --bg-2:#0e0e16; --bg-3:#14141f; --bg-4:#1b1b28;
  --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.06); --surface-3:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.12); --border-3:rgba(255,255,255,.18);
  --text:#f2f2f7; --text-2:#a4a4b8; --text-3:#6b6b80; --text-4:#4a4a5c;
  --accent:#6366f1; --accent-2:#a855f7; --accent-3:#22d3ee;
  --accent-grad:linear-gradient(135deg,#6366f1 0%,#a855f7 55%,#ec4899 100%);
  --accent-soft:rgba(99,102,241,.14); --accent-glow:rgba(99,102,241,.45);
  --success:#10b981; --warn:#f59e0b; --error:#ef4444; --info:#38bdf8;
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px; --r-xl:30px; --r-full:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 8px 24px -6px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -12px rgba(0,0,0,.65);
  --shadow-glow:0 0 40px -8px var(--accent-glow);
  --sidebar-w:280px; --header-h:60px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
  --fs:15px; --lh:1.65;
  --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:.15s; --t:.25s; --t-slow:.4s;
}
[data-theme="light"]{
  --bg:#f6f6fa; --bg-2:#ffffff; --bg-3:#f0f0f6; --bg-4:#e8e8f0;
  --surface:rgba(0,0,0,.025); --surface-2:rgba(0,0,0,.045); --surface-3:rgba(0,0,0,.07);
  --border:rgba(0,0,0,.07); --border-2:rgba(0,0,0,.12); --border-3:rgba(0,0,0,.18);
  --text:#0d0d14; --text-2:#52526a; --text-3:#8686a0; --text-4:#b0b0c4;
  --accent-soft:rgba(99,102,241,.1);
  --shadow-sm:0 1px 2px rgba(20,20,40,.06);
  --shadow:0 8px 24px -6px rgba(20,20,40,.12);
  --shadow-lg:0 24px 60px -12px rgba(20,20,40,.16);
}
html,body{height:100%}
body{
  font-family:var(--font); font-size:var(--fs); line-height:var(--lh);
  background:var(--bg); color:var(--text); overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background var(--t), color var(--t);
}
::selection{background:var(--accent-soft);color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
a{color:var(--accent-3);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
svg{flex-shrink:0}

/* Scrollbars */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--border-3);background-clip:padding-box;border:2px solid transparent}

/* ============ Utility ============ */
.hidden{display:none !important}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.grow{flex:1}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--text-2)}
.muted-3{color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.center{display:grid;place-items:center}

/* ============ Buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:550;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  transition:all var(--t-fast) var(--ease);white-space:nowrap;user-select:none;
  position:relative;letter-spacing:-.01em;
}
.btn:hover{background:var(--surface-3);border-color:var(--border-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent-grad);border-color:transparent;color:#fff;box-shadow:0 4px 16px -4px var(--accent-glow)}
.btn-primary:hover{box-shadow:0 8px 24px -4px var(--accent-glow);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border)}
.btn-danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#f87171}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn-icon{padding:9px;width:38px;height:38px;border-radius:11px}
.btn-icon.btn-sm{padding:6px;width:30px;height:30px;border-radius:9px}

/* ============ Auth Screen ============ */
#auth-screen{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:
    radial-gradient(1000px 600px at 15% 10%, rgba(99,102,241,.16), transparent 60%),
    radial-gradient(900px 600px at 85% 90%, rgba(168,85,247,.14), transparent 60%),
    var(--bg);
  overflow-y:auto;padding:24px;
}
.auth-card{
  width:100%;max-width:430px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--r-xl);padding:40px 36px;box-shadow:var(--shadow-lg);
  position:relative;overflow:hidden;animation:floatIn .5s var(--ease-out) both;
}
.auth-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7;
}
@keyframes floatIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.03em}
.brand-mark{
  width:36px;height:36px;border-radius:11px;background:var(--accent-grad);
  display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px -4px var(--accent-glow);
  flex-shrink:0;
}
.brand-name{font-size:17px}
.brand-tag{font-size:11.5px;color:var(--text-3);font-weight:450;letter-spacing:.01em;margin-top:1px}
.auth-title{font-size:26px;font-weight:730;letter-spacing:-.035em;margin:28px 0 6px}
.auth-sub{color:var(--text-2);font-size:14px;margin-bottom:26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:7px;letter-spacing:.005em}
.input{
  width:100%;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);
  border:1px solid var(--border);color:var(--text);font-size:14px;
  transition:all var(--t-fast) var(--ease);
}
.input:focus{border-color:var(--accent);background:var(--surface-2);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--text-4)}
.auth-divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--text-3);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-switch{text-align:center;margin-top:22px;font-size:13.5px;color:var(--text-2)}
.auth-switch button{color:var(--accent-3);font-weight:600}
.auth-err{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.28);color:#fca5a5;
  padding:10px 13px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none;
}
.auth-err.show{display:block;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ============ App Shell ============ */
#app{display:none;height:100dvh;width:100%}
#app.on{display:flex}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100%;transition:transform var(--t-slow) var(--ease-out);
  z-index:60;
}
.sb-head{padding:14px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sb-search{padding:0 12px 10px;position:relative}
.sb-search input{
  width:100%;padding:9px 12px 9px 34px;border-radius:10px;background:var(--surface);
  border:1px solid var(--border);font-size:13px;transition:all var(--t-fast);
}
.sb-search input:focus{border-color:var(--accent);background:var(--surface-2)}
.sb-search svg{position:absolute;left:23px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.sb-nav{padding:0 10px 8px;display:flex;flex-direction:column;gap:1px}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:10px;
  font-size:13.5px;font-weight:500;color:var(--text-2);transition:all var(--t-fast);
  width:100%;text-align:left;position:relative;
}
.sb-item:hover{background:var(--surface-2);color:var(--text)}
.sb-item.active{background:var(--accent-soft);color:var(--text);font-weight:600}
.sb-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--accent)}
.sb-item svg{opacity:.85}
.sb-item .badge{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent-3);font-weight:700}
.sb-label{font-size:11px;font-weight:650;color:var(--text-4);text-transform:uppercase;letter-spacing:.09em;padding:14px 14px 6px;display:flex;justify-content:space-between;align-items:center}
.sb-label button{color:var(--text-4);padding:3px;border-radius:6px}
.sb-label button:hover{color:var(--text-2);background:var(--surface-2)}
.sb-chats{flex:1;overflow-y:auto;padding:0 10px 10px;min-height:0}
.chat-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  font-size:13px;color:var(--text-2);transition:all var(--t-fast);cursor:pointer;
  position:relative;width:100%;text-align:left;
}
.chat-item:hover{background:var(--surface-2);color:var(--text)}
.chat-item.active{background:var(--surface-3);color:var(--text);font-weight:550}
.chat-item .ci-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .ci-actions{display:none;gap:2px}
.chat-item:hover .ci-actions,.chat-item.active .ci-actions{display:flex}
.chat-item .ci-actions button{padding:3px;border-radius:6px;color:var(--text-3);display:grid;place-items:center}
.chat-item .ci-actions button:hover{background:var(--surface-3);color:var(--text)}
.sb-foot{padding:10px;border-top:1px solid var(--border)}
.user-chip{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;
  transition:background var(--t-fast);width:100%;text-align:left;
}
.user-chip:hover{background:var(--surface-2)}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--accent-grad);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#fff;flex-shrink:0;
}
.avatar.sm{width:26px;height:26px;font-size:11px}
.user-meta{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;line-height:1.25}
.user-plan{font-size:11px;color:var(--text-3);line-height:1.25}

/* ============ Main ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;position:relative;background:var(--bg)}
.topbar{
  height:var(--header-h);flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  position:relative;z-index:30;
}
.icon-btn{
  display:grid;place-items:center;width:36px;height:36px;border-radius:10px;
  color:var(--text-2);transition:all var(--t-fast);
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent-3)}
#menu-btn{display:none}

/* Model selector */
.model-sel{position:relative}
.model-btn{
  display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);font-size:13.5px;font-weight:600;
  transition:all var(--t-fast);
}
.model-btn:hover{background:var(--surface-2);border-color:var(--border-2)}
.model-btn .mdot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.model-btn .msub{font-size:11px;color:var(--text-3);font-weight:500}
.dropdown{
  position:absolute;top:calc(100% + 8px);left:0;min-width:290px;
  background:var(--bg-3);border:1px solid var(--border-2);border-radius:var(--r);
  box-shadow:var(--shadow-lg);padding:6px;z-index:100;
  animation:dropIn .18s var(--ease-out);backdrop-filter:blur(20px);
}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dd-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;
  font-size:13.5px;width:100%;text-align:left;transition:background var(--t-fast);
}
.dd-item:hover{background:var(--surface-2)}
.dd-item.sel{background:var(--accent-soft)}
.dd-item .dd-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex-shrink:0}
.dd-item .dd-t{font-weight:600;font-size:13.5px}
.dd-item .dd-s{font-size:11.5px;color:var(--text-3);margin-top:1px}
.dd-sep{height:1px;background:var(--border);margin:5px 8px}

/* Tools menu */
.tools-menu{position:absolute;top:calc(100% + 8px);right:0;width:min(560px,calc(100vw - 32px));
  background:var(--bg-3);border:1px solid var(--border-2);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);padding:16px;z-index:100;animation:dropIn .18s var(--ease-out);
  backdrop-filter:blur(24px);max-height:min(70vh,520px);overflow-y:auto}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.tool-card{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;
  text-align:left;transition:all var(--t-fast);border:1px solid transparent;
}
.tool-card:hover{background:var(--surface-2);border-color:var(--border)}
.tool-card.on{background:var(--accent-soft);border-color:rgba(99,102,241,.35)}
.tool-card .tc-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex-shrink:0;color:var(--accent-3)}
.tool-card.on .tc-ic{background:var(--accent);color:#fff}
.tool-card .tc-n{font-size:12.5px;font-weight:600;line-height:1.2}
.tool-card .tc-d{font-size:10.5px;color:var(--text-3);line-height:1.2;margin-top:1px}
.tools-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 2px}
.tools-head h4{font-size:13px;font-weight:700;letter-spacing:-.01em}
.tools-head span{font-size:11.5px;color:var(--text-3)}

/* ============ Chat Area ============ */
.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;min-height:0}
.chat-inner{max-width:820px;margin:0 auto;padding:28px 24px 8px;min-height:100%;display:flex;flex-direction:column}

/* Welcome */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 0;animation:fadeUp .6s var(--ease-out)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.welcome-orb{
  width:76px;height:76px;border-radius:24px;background:var(--accent-grad);
  display:grid;place-items:center;color:#fff;margin-bottom:22px;
  box-shadow:0 20px 50px -12px var(--accent-glow);position:relative;animation:float 5s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome h1{font-size:clamp(24px,4vw,34px);font-weight:760;letter-spacing:-.04em;margin-bottom:9px;
  background:linear-gradient(135deg,var(--text) 20%,var(--accent-3) 60%,var(--accent-2) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--text-2);font-size:15px;max-width:440px;margin-bottom:32px}
.sugg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:620px}
.sugg{
  display:flex;flex-direction:column;gap:6px;padding:14px 15px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);text-align:left;
  transition:all var(--t) var(--ease);position:relative;overflow:hidden;
}
.sugg:hover{background:var(--surface-2);border-color:var(--border-3);transform:translateY(-2px);box-shadow:var(--shadow)}
.sugg .sg-ic{color:var(--accent-3);margin-bottom:2px}
.sugg .sg-t{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.sugg .sg-d{font-size:12px;color:var(--text-3);line-height:1.4}

/* Messages */
.msg{display:flex;gap:14px;padding:20px 0;animation:msgIn .35s var(--ease-out);position:relative}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg-av{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;margin-top:2px;
}
.msg.user .msg-av{background:linear-gradient(135deg,#475569,#334155)}
.msg.assistant .msg-av{background:var(--accent-grad);box-shadow:0 4px 12px -3px var(--accent-glow)}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.msg-name{font-size:13px;font-weight:700;letter-spacing:-.01em}
.msg-model{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--text-3);font-weight:600}
.msg-time{font-size:11px;color:var(--text-4);margin-left:auto}
.msg-content{font-size:15px;line-height:1.72;color:var(--text);word-wrap:break-word;overflow-wrap:break-word}
.msg.user .msg-content{color:var(--text-2)}

/* Markdown */
.msg-content p{margin:0 0 12px}
.msg-content p:last-child{margin-bottom:0}
.msg-content h1,.msg-content h2,.msg-content h3,.msg-content h4{margin:22px 0 10px;font-weight:700;letter-spacing:-.025em;line-height:1.3}
.msg-content h1{font-size:22px}.msg-content h2{font-size:19px}.msg-content h3{font-size:16.5px}.msg-content h4{font-size:15px}
.msg-content h1:first-child,.msg-content h2:first-child,.msg-content h3:first-child{margin-top:0}
.msg-content ul,.msg-content ol{margin:0 0 12px;padding-left:22px}
.msg-content li{margin-bottom:6px}
.msg-content li::marker{color:var(--accent-3)}
.msg-content blockquote{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:12px 0;color:var(--text-2);background:var(--surface);border-radius:0 8px 8px 0}
.msg-content code:not(pre code){
  background:var(--surface-2);padding:2px 6px;border-radius:6px;font-family:var(--mono);
  font-size:.87em;color:var(--accent-3);border:1px solid var(--border);
}
.msg-content a{color:var(--accent-3);border-bottom:1px solid transparent;transition:border-color var(--t-fast)}
.msg-content a:hover{border-bottom-color:var(--accent-3)}
.msg-content hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.msg-content table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.msg-content th,.msg-content td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border)}
.msg-content th{background:var(--surface-2);font-weight:650;font-size:12.5px}
.msg-content tr:last-child td{border-bottom:none}
.msg-content strong{font-weight:680;color:var(--text)}

/* Code blocks */
.code-wrap{margin:14px 0;border-radius:12px;overflow:hidden;border:1px solid var(--border-2);background:var(--bg-2)}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.code-lang{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.code-copy{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-3);padding:4px 8px;border-radius:7px;transition:all var(--t-fast);font-weight:600}
.code-copy:hover{background:var(--surface-3);color:var(--text)}
.code-copy.done{color:var(--success)}
.code-wrap pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.65;background:transparent}
.code-wrap code{font-family:var(--mono);color:var(--text)}
.tok-key{color:#c084fc}.tok-str{color:#86efac}.tok-num{color:#fbbf24}.tok-com{color:#64748b;font-style:italic}.tok-fn{color:#60a5fa}
[data-theme="light"] .tok-key{color:#7c3aed}[data-theme="light"] .tok-str{color:#16a34a}[data-theme="light"] .tok-num{color:#d97706}[data-theme="light"] .tok-com{color:#94a3b8}[data-theme="light"] .tok-fn{color:#2563eb}

/* Message actions */
.msg-actions{display:flex;gap:3px;margin-top:10px;opacity:0;transition:opacity var(--t-fast);flex-wrap:wrap}
.msg:hover .msg-actions,.msg-actions.pin{opacity:1}
.msg-actions button{
  display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;
  font-size:11.5px;color:var(--text-3);font-weight:550;transition:all var(--t-fast);
}
.msg-actions button:hover{background:var(--surface-2);color:var(--text)}
.msg-actions button.done{color:var(--success)}
.edit-box{width:100%;margin-top:8px}
.edit-box textarea{
  width:100%;padding:12px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--accent);font-size:14.5px;line-height:1.6;resize:vertical;min-height:80px;
  font-family:var(--font);color:var(--text);
}
.edit-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}

/* Typing caret */
.caret{display:inline-block;width:7px;height:17px;background:var(--accent-3);border-radius:2px;margin-left:2px;vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.typing{display:flex;gap:5px;align-items:center;padding:6px 0}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1.3s infinite}
.typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-7px);opacity:1}}

/* Sources / attachments inside message */
.attach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0}
.attach-card{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);transition:all var(--t-fast);
}
.attach-card:hover{background:var(--surface-2);border-color:var(--border-2)}
.attach-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-size:10px;font-weight:800;flex-shrink:0;color:var(--accent-3);border:1px solid var(--border)}
.attach-meta{flex:1;min-width:0}
.attach-n{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-s{font-size:11px;color:var(--text-3)}
.attach-x{padding:3px;border-radius:6px;color:var(--text-3)}
.attach-x:hover{background:var(--surface-3);color:var(--error)}
.attach-img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}

/* Sources list */
.sources{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.sources h5{font-size:11.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.source-item{display:flex;gap:9px;padding:6px 0;font-size:12.5px;align-items:flex-start}
.source-num{width:18px;height:18px;border-radius:5px;background:var(--accent-soft);color:var(--accent-3);font-size:10px;font-weight:700;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.source-item a{color:var(--text-2);font-size:12.5px}
.source-item a:hover{color:var(--accent-3)}

/* ============ Composer ============ */
.composer-wrap{padding:0 24px 20px;flex-shrink:0;background:linear-gradient(to top,var(--bg) 60%,transparent);position:relative;z-index:20}
.composer{max-width:820px;margin:0 auto;position:relative}
.composer-inner{
  background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--r-lg);
  padding:6px;transition:all var(--t) var(--ease);box-shadow:var(--shadow);
  position:relative;
}
.composer-inner:focus-within{border-color:rgba(99,102,241,.5);box-shadow:var(--shadow),0 0 0 4px var(--accent-soft)}
.composer textarea{
  width:100%;padding:10px 12px 4px;font-size:15px;line-height:1.6;resize:none;
  max-height:220px;min-height:26px;font-family:var(--font);color:var(--text);background:transparent;
}
.composer textarea::placeholder{color:var(--text-4)}
.composer-bar{display:flex;align-items:center;gap:4px;padding:2px 4px 2px 2px}
.composer-bar .grow{flex:1}
.c-btn{
  display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
  color:var(--text-3);transition:all var(--t-fast);position:relative;
}
.c-btn:hover{background:var(--surface-2);color:var(--text)}
.c-btn.on{background:var(--accent-soft);color:var(--accent-3)}
.c-btn.rec{background:rgba(239,68,68,.15);color:#f87171;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.send-btn{
  width:36px;height:36px;border-radius:11px;background:var(--accent-grad);color:#fff;
  display:grid;place-items:center;transition:all var(--t-fast);box-shadow:0 3px 12px -3px var(--accent-glow);
}
.send-btn:hover{filter:brightness(1.1);transform:scale(1.04)}
.send-btn:disabled{opacity:.35;box-shadow:none;transform:none;cursor:not-allowed;filter:grayscale(.6)}
.send-btn.stop{background:linear-gradient(135deg,#ef4444,#f97316)}

/* Attachments preview in composer */
.attach-preview{display:flex;gap:8px;flex-wrap:wrap;padding:8px 8px 4px}
.attach-chip{
  display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);font-size:12px;max-width:220px;
  animation:msgIn .25s var(--ease-out);
}
.attach-chip img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.attach-chip .ac-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.attach-chip button{padding:2px;border-radius:5px;color:var(--text-3)}
.attach-chip button:hover{color:var(--error)}

/* Active tools bar */
.active-tools{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 8px}
.tool-pill{
  display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  background:var(--accent-soft);border:1px solid rgba(99,102,241,.28);color:var(--accent-3);
  font-size:11px;font-weight:600;animation:msgIn .2s var(--ease-out);
}
.tool-pill button{color:inherit;opacity:.7;display:grid;place-items:center}
.tool-pill button:hover{opacity:1}
.composer-hint{text-align:center;font-size:11px;color:var(--text-4);margin-top:9px}

/* ============ Generic View Layout ============ */
.view{flex:1;overflow-y:auto;min-height:0}
.view-inner{max-width:1100px;margin:0 auto;padding:32px 24px 60px}
.view-head{margin-bottom:28px}
.view-head h1{font-size:clamp(22px,3.4vw,30px);font-weight:750;letter-spacing:-.04em;margin-bottom:6px}
.view-head p{color:var(--text-2);font-size:14.5px;max-width:640px}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:32px}
.stat{
  padding:18px;border-radius:var(--r);background:var(--bg-2);border:1px solid var(--border);
  transition:all var(--t) var(--ease);position:relative;overflow:hidden;
}
.stat:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;background:radial-gradient(circle,var(--accent-soft),transparent 70%);pointer-events:none}
.stat-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-3);display:grid;place-items:center;margin-bottom:12px}
.stat-v{font-size:26px;font-weight:750;letter-spacing:-.03em;line-height:1.1}
.stat-l{font-size:12.5px;color:var(--text-3);margin-top:3px;font-weight:500}
.section{margin-bottom:34px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-head h2{font-size:16px;font-weight:700;letter-spacing:-.02em}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{
  padding:16px;border-radius:var(--r);background:var(--bg-2);border:1px solid var(--border);
  transition:all var(--t) var(--ease);text-align:left;display:flex;flex-direction:column;gap:9px;
  position:relative;overflow:hidden;
}
.card:hover{border-color:var(--border-3);transform:translateY(-3px);box-shadow:var(--shadow)}
.card-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent-3)}
.card-t{font-size:14px;font-weight:650;letter-spacing:-.015em}
.card-d{font-size:12.5px;color:var(--text-3);line-height:1.5}
.card-meta{font-size:11px;color:var(--text-4);margin-top:auto;display:flex;gap:8px;align-items:center}

/* Empty state */
.empty{
  padding:56px 24px;text-align:center;border-radius:var(--r-lg);
  border:1px dashed var(--border-2);background:var(--surface);
}
.empty-ic{width:56px;height:56px;border-radius:17px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 16px;color:var(--text-3)}
.empty h3{font-size:16px;font-weight:680;margin-bottom:6px;letter-spacing:-.02em}
.empty p{font-size:13.5px;color:var(--text-3);max-width:340px;margin:0 auto 18px}

/* Forms / settings */
.panel{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.panel-head{padding:15px 18px;border-bottom:1px solid var(--border)}
.panel-head h3{font-size:14.5px;font-weight:680;letter-spacing:-.02em}
.panel-head p{font-size:12.5px;color:var(--text-3);margin-top:2px}
.panel-body{padding:6px 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row-info{flex:1;min-width:0}
.row-t{font-size:13.5px;font-weight:600}
.row-d{font-size:12px;color:var(--text-3);margin-top:1px}
.switch{width:42px;height:24px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border-2);position:relative;transition:all var(--t) var(--ease);flex-shrink:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-3);transition:all var(--t) var(--ease)}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:20px;background:#fff}
.seg{display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--surface);border:1px solid var(--border)}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-3);transition:all var(--t-fast)}
.seg button.on{background:var(--surface-3);color:var(--text)}
.select{
  padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  font-size:13px;font-weight:550;cursor:pointer;min-width:150px;
}
.select:focus{border-color:var(--accent)}

/* Image generation */
.gen-layout{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
.gen-panel{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);padding:18px;position:sticky;top:0}
.gen-panel h3{font-size:14px;font-weight:680;margin-bottom:14px;letter-spacing:-.02em}
.size-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px}
.size-opt{
  padding:10px;border-radius:11px;background:var(--surface);border:1px solid var(--border);
  text-align:center;transition:all var(--t-fast);
}
.size-opt:hover{background:var(--surface-2)}
.size-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.size-opt .so-v{font-size:12.5px;font-weight:650}
.size-opt .so-l{font-size:10.5px;color:var(--text-3);margin-top:1px}
.gen-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gen-card{
  border-radius:var(--r);overflow:hidden;background:var(--bg-2);border:1px solid var(--border);
  transition:all var(--t) var(--ease);position:relative;group:gen;
}
.gen-card:hover{border-color:var(--border-3);transform:translateY(-3px);box-shadow:var(--shadow)}
.gen-card .gc-img{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:var(--bg-3)}
.gen-card .gc-bar{padding:10px 12px;display:flex;align-items:center;gap:6px}
.gen-card .gc-p{font-size:11.5px;color:var(--text-3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gen-skeleton{aspect-ratio:1;background:linear-gradient(90deg,var(--bg-3) 25%,var(--surface-2) 50%,var(--bg-3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Research */
.research-report{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;margin-top:20px;animation:fadeUp .5s var(--ease-out)}
.research-report h2{font-size:20px;font-weight:720;letter-spacing:-.03em;margin-bottom:6px}
.research-report .rr-meta{font-size:12px;color:var(--text-3);margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.rr-section{margin-bottom:22px}
.rr-section h3{font-size:15px;font-weight:680;margin-bottom:9px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.rr-section h3::before{content:'';width:3px;height:15px;border-radius:2px;background:var(--accent-grad)}
.rr-section p{font-size:14px;color:var(--text-2);line-height:1.75}
.rr-progress{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.rr-step{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--text-3);animation:msgIn .3s var(--ease-out)}
.rr-step.done{color:var(--text-2)}
.rr-step .rs-ic{width:22px;height:22px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0}
.rr-step.done .rs-ic{background:rgba(16,185,129,.15);color:var(--success)}
.rr-step.active .rs-ic{background:var(--accent-soft);color:var(--accent-3)}

/* Study mode */
.study-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:24px}
.flashcard{
  perspective:1000px;height:170px;cursor:pointer;
}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s var(--ease);transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);
  background:var(--bg-2);border:1px solid var(--border);padding:20px;
  display:flex;flex-direction:column;justify-content:center;text-align:center;gap:8px;
}
.flashcard-back{transform:rotateY(180deg);background:var(--accent-soft);border-color:rgba(99,102,241,.3)}
.flashcard-face .fc-q{font-size:14.5px;font-weight:650;letter-spacing:-.02em}
.flashcard-face .fc-a{font-size:13px;color:var(--text-2);line-height:1.6}
.flashcard-face .fc-tag{font-size:10.5px;color:var(--text-4);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

/* Admin */
.admin-tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--border);overflow-x:auto}
.admin-tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;transition:all var(--t-fast);white-space:nowrap}
.admin-tab:hover{color:var(--text-2)}
.admin-tab.on{color:var(--text);border-bottom-color:var(--accent)}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--text-4);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border)}
.data-table td{padding:12px;border-bottom:1px solid var(--border);color:var(--text-2)}
.data-table tr:hover td{background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:650}
.badge.ok{background:rgba(16,185,129,.14);color:#34d399}
.badge.warn{background:rgba(245,158,11,.14);color:#fbbf24}
.badge.err{background:rgba(239,68,68,.14);color:#f87171}
.badge.info{background:var(--accent-soft);color:var(--accent-3)}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
  z-index:300;display:grid;place-items:center;padding:20px;animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:440px;background:var(--bg-2);border:1px solid var(--border-2);
  border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow-lg);animation:floatIn .3s var(--ease-out);
}
.modal h3{font-size:17px;font-weight:700;letter-spacing:-.025em;margin-bottom:7px}
.modal p{font-size:13.5px;color:var(--text-2);margin-bottom:18px;line-height:1.6}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  padding:11px 18px;border-radius:12px;background:var(--bg-4);border:1px solid var(--border-2);
  font-size:13px;font-weight:550;box-shadow:var(--shadow-lg);animation:toastIn .3s var(--ease-out);
  display:flex;align-items:center;gap:9px;backdrop-filter:blur(16px);pointer-events:auto;max-width:90vw;
}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.toast.err{border-color:rgba(239,68,68,.4);color:#fca5a5}
.toast.ok{border-color:rgba(16,185,129,.4)}
.toast.out{animation:toastOut .25s var(--ease) forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.96)}}

/* Voice overlay */
.voice-overlay{
  position:fixed;inset:0;background:rgba(8,8,13,.85);backdrop-filter:blur(24px);
  z-index:250;display:grid;place-items:center;animation:fadeIn .25s;
}
.voice-box{text-align:center;max-width:400px;padding:32px}
.voice-orb{
  width:130px;height:130px;border-radius:50%;background:var(--accent-grad);
  margin:0 auto 28px;display:grid;place-items:center;color:#fff;position:relative;
  box-shadow:0 0 70px -6px var(--accent-glow);
}
.voice-orb::before,.voice-orb::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ripple 2.2s infinite}
.voice-orb::after{animation-delay:1.1s}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
.voice-status{font-size:16px;font-weight:650;margin-bottom:8px}
.voice-transcript{font-size:14px;color:var(--text-2);min-height:44px;line-height:1.6;margin-bottom:26px}
.voice-actions{display:flex;gap:12px;justify-content:center}

/* Loading screen */
#boot{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:500;transition:opacity .4s}
#boot.off{opacity:0;pointer-events:none}
.boot-orb{width:52px;height:52px;border-radius:16px;background:var(--accent-grad);animation:float 2s ease-in-out infinite;box-shadow:0 16px 40px -8px var(--accent-glow)}

/* Mobile */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;backdrop-filter:blur(2px)}
@media(max-width:900px){
  :root{--sidebar-w:290px}
  #menu-btn{display:grid}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow-lg)}

============================================================================ */
const MockAI = {
  async *stream({ messages, model, tools, attachments, signal }) {
    const last = [...messages].reverse().find(m => m.role === 'user');
    const prompt = (last?.content || '').trim();

    // Simulated network latency

    if (signal?.aborted) return;

    const text = generateResponse(prompt, meta, [...tools], attachments);
    const chunks = text.match(/[\s\S]{1,4}/g) || [];
    const speed = { slow: 42, normal: 20, fast: 8 }[State.settings.streamingSpeed] || 20;

    for (const c of chunks) {
      if (signal?.aborted) return;
      yield c;
      await sleep(speed * (0.5 + Math.random()));
    }
  },
  async generateImage(prompt, size) {
    await sleep(1400 + Math.random() * 1200);
    if (Math.random() < 0.04) throw new Error('Image service temporarily unavailable. Please retry.');

      'Formulating research plan…',
      'Searching 24 web sources…',
      'Extracting key claims…',
      'Cross-checking sources…',
      'Comparing viewpoints…',
      'Synthesizing findings…'
    ];
    for (const s of steps) {
      yield { type: 'step', text: s };
      for (let i = 0; i < 8; i++) { if (signal?.aborted) return; await sleep(90); }
    }
    const report = buildResearchReport(query);
    const chunks = report.match(/[\s\S]{1,4}/g) || [];
    for (const c of chunks) { if (signal?.aborted) return; yield { type: 'delta', text: c }; await sleep(9); }
  }
};

function makeArt(prompt, size) {
  const dims = { '1024x1024':[1024,1024], '1792x1024':[896,512], '1024x1792':[512,896], '512x512':[512,512] }[size] || [1024,1024];
  const [w, h] = dims;
  const seed = [...prompt].reduce((a, c) => a + c.charCodeAt(0), 0);
  const hue1 = seed % 360;
  const hue2 = (hue1 + 60 + (seed % 90)) % 360;
  const hue3 = (hue2 + 80) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs>
      <radialGradient id="g1" cx="${(seed % 40) + 20}%" cy="${(seed % 30) + 20}%" r="80%">
        <stop offset="0%" stop-color="hsl(${hue1},85%,68%)"/>
        <stop offset="55%" stop-color="hsl(${hue2},72%,42%)"/>
        <stop offset="100%" stop-color="hsl(${hue3},60%,14%)"/>
      </radialGradient>
      <filter id="b"><feGaussianBlur stdDeviation="${Math.max(w,h) * 0.028}"/></filter>
      <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/><feColorMatrix values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.35 0"/></filter>
    </defs>
    <rect width="${w}" height="${h}" fill="url(#g1)"/>
    <g filter="url(#b)" opacity="0.65">
      ${Array.from({length:7},(_,i)=>{
        const cx=(seed*(i+3))%w, cy=(seed*(i+5))%h;
        const r=Math.min(w,h)*(0.10+((seed+i*31)%50)/170);
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="hsl(${(hue1+i*47)%360},80%,60%)" opacity="${0.30+((i*17)%40)/100}"/>`;
      }).join('')}
    </g>
    <rect width="${w}" height="${h}" filter="url(#n)" opacity="0.35"/>
  </svg>`;
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

/* ============================ 7. MARKDOWN ============================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlight(code, lang) {
  let h = escapeHtml(code);
  h = h.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*|--[^\n]*)/g, '<span class="tok-com">$1</span>');
  h = h.replace(/(&quot;[\s\S]*?&quot;|&#39;[\s\S]*?&#39;|`[^`\n]*`)/g, '<span class="tok-str">$1</span>');
  h = h.replace(/\b(function|const|let|var|if|else|for|while|return|class|new|async|await|import|from|export|default|def|print|public|private|protected|void|int|float|string|bool|true|false|null|None|True|False|this|self|try|catch|finally|throw|extends|implements|interface|type|enum|yield|lambda|with|as|in|is|not|and|or|select|from|where|INSERT|UPDATE|DELETE|SELECT|FROM|WHERE)\b/g, '<span class="tok-key">$1</span>');
  h = h.replace(/\b(\d+\.?\d*)\b/g, '<span class="tok-num">$1</span>');
  h = h.replace(/\b([a-zA-Z_$][\w$]*)(?=\s*\()/g, '<span class="tok-fn">$1</span>');
  return h;
}
function renderMarkdown(src) {
  if (!src) return '';
  const blocks = [];
  // Extract fenced code blocks first
  let text = String(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.length;
    const l = lang || 'text';
    blocks.push(`<div class="code-wrap"><div class="code-head"><span class="code-lang">${escapeHtml(l)}</span><button class="code-copy" data-code="${encodeURIComponent(code.trimEnd())}">${icon('copy',12)}<span>Copy</span></button></div><pre><code>${highlight(code.trimEnd(), l)}</code></pre></div>`);
    return `\u0000BLOCK${i}\u0000`;
  });

  text = escapeHtml(text);

  // Tables
  text = text.replace(/^\|(.+)\|\n\|[-:\s|]+\|\n((?:\|.*\|\n?)*)/gm, (_, head, body) => {
    const th = head.split('|').map(s => `<th>${s.trim()}</th>`).join('');
    const rows = body.trim().split('\n').map(r =>
      `<tr>${r.replace(/^\||\|$/g,'').split('|').map(c => `<td>${c.trim()}</td>`).join('')}</tr>`
    ).join('');
    return `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
  });

  // Headings
  text = text.replace(/^######\s+(.+)$/gm, '<h4>$1</h4>')
             .replace(/^#####\s+(.+)$/gm, '<h4>$1</h4>')
             .replace(/^####\s+(.+)$/gm, '<h4>$1</h4>')
             .replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
             .replace(/^##\s+(.+)$/gm, '<h2>$1</h2>')
             .replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

  // Blockquote
  text = text.replace(/^&gt;\s?(.+)$/gm, '<blockquote>$1</blockquote>');
  text = text.replace(/<\/blockquote>\n<blockquote>/g, '<br>');

  // HR
  text = text.replace(/^(?:---|\*\*\*|___)$/gm, '<hr>');

  // Bold / italic / inline code / strike
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
             .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
             .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
             .replace(/`([^`\n]+)`/g, '<code>$1</code>')
             .replace(/~~(.+?)~~/g, '<del>$1</del>');

  // Links
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Lists
  text = text.replace(/^(\s*)[-*+]\s+(.+)$/gm, (_, ind, item) => `${ind}<li data-ul>${item}</li>`);
  text = text.replace(/^(\s*)\d+\.\s+(.+)$/gm, (_, ind, item) => `${ind}<li data-ol>${item}</li>`);
  text = text.replace(/(<li data-ul>[\s\S]*?<\/li>)(?!\s*<li data-ul>)/g, m => `<ul>${m.replace(/ data-ul/g,'')}</ul>`);
  text = text.replace(/(<li data-ol>[\s\S]*?<\/li>)(?!\s*<li data-ol>)/g, m => `<ol>${m.replace(/ data-ol/g,'')}</ol>`);
  text = text.replace(/ data-ul| data-ol/g, '');

  // Paragraphs
  text = text.split(/\n{2,}/).map(chunk => {
    const t = chunk.trim();
    if (!t) return '';
    if (/^<(h[1-4]|ul|ol|table|blockquote|hr|div|pre)/.test(t) || /^\u0000BLOCK/.test(t)) return t;
    return `<p>${t.replace(/\n/g, '<br>')}</p>`;
  }).join('');

  // Restore code blocks
  text = text.replace(/\u0000BLOCK(\d+)\u0000/g, (_, i) => blocks[+i]);
  return text;
}

/* ---- Composer wiring ---- */
function wireComposer() {
  const input = document.getElementById('composer-input');
  const send = document.getElementById('send-btn');
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('file-input');
  const micBtn = document.getElementById('mic-btn');

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 220) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && State.settings.sendOnEnter) {
      e.preventDefault();
      sendMessage();
    }
  });
  send.addEventListener('click', () => State.generating ? stopGeneration() : sendMessage());
  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));
  document.getElementById('tools-btn-2')?.addEventListener('click', e => { e.stopPropagation(); openToolsMenu(); });
  micBtn.addEventListener('click', () => startVoiceInput());

  // Drag & drop
  const inner = document.getElementById('composer-inner');
  ['dragover','dragenter'].forEach(ev => inner.addEventListener(ev, e => {
    e.preventDefault(); inner.style.borderColor = 'var(--accent)';
  }));
  ['dragleave','drop'].forEach(ev => inner.addEventListener(ev, e => {
    e.preventDefault(); inner.style.borderColor = '';
    if (ev === 'drop' && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  }));

  // Paste images
  input.addEventListener('paste', e => {
    const items = [...(e.clipboardData?.items || [])];
    const files = items.filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); handleFiles(files); }
  });
}

function handleFiles(fileList) {
  const files = [...fileList];
  const allowed = /\.(pdf|docx?|txt|csv|xlsx?|png|jpe?g|gif|webp|bmp|svg|mp3|wav|m4a|ogg|webm)$/i;
  files.forEach(f => {
    if (!allowed.test(f.name) && !f.type.match(/^(image|audio)\//)) {
      toast(`Unsupported file: ${f.name}`, 'err'); return;
    }
    if (f.size > 25 * 1024 * 1024) { toast(`${f.name} exceeds 25 MB`, 'err'); return; }
    const item = { id: uid(), name: f.name, size: f.size, type: f.type, file: f };
    if (f.type.startsWith('image/')) {
      const r = new FileReader();
      r.onload = e => { item.dataUrl = e.target.result; renderAttachPreview(); };
      r.readAsDataURL(f);
    }
    State.attachments.push(item);
  });
  renderAttachPreview();
}

function renderAttachPreview() {
  const el = document.getElementById('attach-preview');
  if (!el) return;
  el.innerHTML = State.attachments.map(f => {
    const isImg = f.type?.startsWith('image/');
    return `<div class="attach-chip">
      ${isImg && f.dataUrl ? `<img src="${f.dataUrl}" alt="">` : icon('file',14)}
      <span class="ac-n">${esc(f.name)}</span>
      <button data-rmfile="${f.id}">${icon('close',12)}</button>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-rmfile]').forEach(b => b.addEventListener('click', () => {
    State.attachments = State.attachments.filter(x => x.id !== b.dataset.rmfile);
    renderAttachPreview();
  }));
}

/* ---- Send / stream ---- */
async function sendMessage() {
  const input = document.getElementById('composer-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text && !State.attachments.length) return;
  if (State.generating) return;

  let conv = getConv(State.currentConv);
  if (!conv) { conv = newConversation(); State.currentView = 'chat'; renderSidebar(); }

  const userMsg = {
    id: uid(), role: 'user', content: text, createdAt: Date.now(),
    attachments: State.attachments.map(f => ({ id:f.id, name:f.name, size:f.size, type:f.type, dataUrl:f.dataUrl }))
  };
  conv.messages.push(userMsg);
  autoTitle(conv);
  touchConv(conv);

  // Reset composer
  input.value = ''; input.style.height = 'auto';
  State.attachments = [];
  renderAttachPreview();
  trackUsage(1, 0);

  // Re-render
  if (conv.messages.length === 1) renderView();
  else appendMessage(userMsg, conv);

  await streamAssistant(conv);
}

async function streamAssistant(conv) {
  State.generating = true;
  State.abort = new AbortController();
  updateSendButton();

  const assistantMsg = {
    id: uid(), role: 'assistant', content: '', createdAt: Date.now(),
    model: State.model
  };
  conv.messages.push(assistantMsg);
  appendMessage(assistantMsg, conv, true);

  const msgEl = document.querySelector(`[data-msg="${assistantMsg.id}"] [data-content]`);
  const actionsEl = document.querySelector(`[data-msg="${assistantMsg.id}"] [data-actions]`);
  if (actionsEl) actionsEl.classList.remove('pin');

  // Typing indicator
  msgEl.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  scrollBottom();

  let full = '';
  let started = false;
  try {
    const tools = [...State.activeTools].map(id => TOOLS.find(t => t.id === id)?.name);
    for await (const chunk of MockAI.stream({
      messages: conv.messages,
      model: State.model,
      tools,
      attachments: conv.messages.filter(m => m.role === 'user').slice(-1)[0]?.attachments || [],
      signal: State.abort.signal
    })) {
      if (!started) { started = true; msgEl.innerHTML = ''; }
      full += chunk;
      msgEl.innerHTML = renderMarkdown(full) + '<span class="caret"></span>';
      scrollBottom();
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      msgEl.innerHTML = `<div style="color:#f87171;display:flex;gap:8px;align-items:flex-start">
        ${icon('alert',16)}<div><strong>Something went wrong.</strong><br>${esc(e.message)}</div></div>`;
      toast('Generation failed', 'err');
    }
  }

  assistantMsg.content = full || '_Generation stopped._';
  if (State.abort?.signal.aborted && !full) assistantMsg.content = '_Generation stopped by user._';
  touchConv(conv);
  trackUsage(0, Math.floor(full.length / 4) + 120);

  // Render final
  if (msgEl) msgEl.innerHTML = renderMarkdown(assistantMsg.content);
  if (actionsEl) actionsEl.classList.add('pin');
  wireMessageActions();

  State.generating = false;
  State.abort = null;
  updateSendButton();

  if (State.settings.autoTTS && assistantMsg.content) speak(assistantMsg.content);
}

function appendMessage(m, conv, noActions = false) {
  const inner = document.getElementById('chat-inner');
  if (!inner) return;
  // Remove welcome if present
  inner.querySelector('.welcome')?.remove();
  const wrap = document.createElement('div');
  wrap.innerHTML = renderMessage(m, conv);
  inner.appendChild(wrap.firstElementChild);
  if (!noActions) wireMessageActions();
  scrollBottom();
}

  const btn = document.getElementById('send-btn');

    btn.classList.remove('stop');

  document.querySelector('.caret')?.remove();

/* ---- Message actions ---- */
function wireMessageActions() {
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const m = findMessage(b.dataset.copy);
    if (!m) return;
    navigator.clipboard.writeText(m.content).then(() => {
      b.classList.add('done'); b.innerHTML = icon('check',13) + ' Copied';
      setTimeout(() => { b.classList.remove('done'); b.innerHTML = icon('copy',13) + ' Copy'; }, 1800);
    });
  });

  document.querySelectorAll('[data-regen]').forEach(b => b.onclick = async () => {
    if (State.generating) return;
    const conv = getConv(State.currentConv); if (!conv) return;
    const idx = conv.messages.findIndex(m => m.id === b.dataset.regen);
    if (idx < 0) return;
    conv.messages.splice(idx);
    touchConv(conv);
    renderChatView();
    await streamAssistant(conv);
  });

  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const conv = getConv(State.currentConv); if (!conv) return;
    const m = conv.messages.find(x => x.id === b.dataset.edit); if (!m) return;
    const msgEl = document.querySelector(`[data-msg="${m.id}"] .msg-body`);
    const existing = msgEl.querySelector('.edit-box');
    if (existing) return;
    const box = document.createElement('div');
    box.className = 'edit-box';
    box.innerHTML = `
      <textarea>${esc(m.content)}</textarea>
      <div class="edit-actions">
        <button class="btn btn-sm" data-cancel>Cancel</button>
        <button class="btn btn-sm btn-primary" data-save>Save & Resend</button>
      </div>`;
    msgEl.appendChild(box);
    const ta = box.querySelector('textarea');
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    box.querySelector('[data-cancel]').onclick = () => box.remove();
    box.querySelector('[data-save]').onclick = async () => {
      const newText = ta.value.trim();
      if (!newText) return;
      const idx = conv.messages.findIndex(x => x.id === m.id);
      conv.messages.splice(idx); // remove this + everything after
      m.content = newText;
      conv.messages.push(m);
      touchConv(conv);
      renderChatView();
      await streamAssistant(conv);
    };
  });

  document.querySelectorAll('[data-speak]').forEach(b => b.onclick = () => {
    const m = findMessage(b.dataset.speak);
    if (m) speak(m.content);
  });
}

function findMessage(id) {
  for (const c of State.conversations) {
    const m = c.messages.find(x => x.id === id);
    if (m) return m;
  }
  return null;
}

/* ============================ 13. VOICE ============================ */
let recognition = null, isListening = false;

function startVoiceInput() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Speech recognition is not supported in this browser.', 'err'); return; }
  if (isListening) { recognition.stop(); return; }

  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  const btn = document.getElementById('mic-btn');
  const input = document.getElementById('composer-input');
  let finalText = '';

  recognition.onstart = () => {
    isListening = true;
    btn?.classList.add('rec');
    toast('Listening… speak now');
  };
  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if (input) input.value = (finalText + interim).trim();
  };
  recognition.onerror = e => {
    isListening = false;
    btn?.classList.remove('rec');
    if (e.error !== 'aborted') toast('Voice error: ' + e.error, 'err');
  };
  recognition.onend = () => {
    isListening = false;
    btn?.classList.remove('rec');
    if (input && finalText.trim()) input.focus();
  };
  recognition.start();
}

function speak(text) {
  if (!('speechSynthesis' in window)) { toast('Text-to-speech not supported', 'err'); return; }
  speechSynthesis.cancel();
  const clean = text.replace(/```[\s\S]*?```/g, ' code block ').replace(/[#*`>_~\[\]()]/g, '').slice(0, 4000);
  const u = new SpeechSynthesisUtterance(clean);
  u.rate = 1.02; u.pitch = 1;
  speechSynthesis.speak(u);
  toast('Speaking…', 'ok');
}

function renderUsageChart() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
    days.push({ d, v: State.usage.byDay?.[d] || 0 });
  }
  const max = Math.max(1, ...days.map(x => x.v));
  return `<div style="display:flex;align-items:flex-end;gap:10px;height:130px">
    ${days.map(x => `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="font-size:11px;color:var(--text-3);font-weight:600">${x.v}</div>
        <div style="width:100%;background:var(--accent-grad);border-radius:7px 7px 3px 3px;height:${Math.max(4, (x.v/max)*90)}px;transition:height .4s var(--ease-out);opacity:${x.v ? 1 : .15}"></div>
        <div style="font-size:10.5px;color:var(--text-4);font-weight:600">${new Date(x.d).toLocaleDateString([], { weekday:'short' }).slice(0,2)}</div>
      </div>`).join('')}
  </div>`;
}

function genCard(img) {

    </div>
  </div>`;

async function generateImage() {
  const prompt = document.getElementById('img-prompt')?.value.trim();
  if (!prompt) { toast('Please enter a prompt', 'err'); return; }
  const size = State.imgSize || '1024x1024';
  const style = document.getElementById('img-style')?.value || '';
  const full = `${prompt}${style ? ', ' + style.toLowerCase() : ''}`;

  const results = document.getElementById('gen-results');
  document.getElementById('gen-empty')?.remove();
  const tempId = 'temp_' + uid();
  results.insertAdjacentHTML('afterbegin', `<div class="gen-card"><div class="gen-skeleton"></div></div>`);
  const btn = document.getElementById('gen-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = icon('refresh',15) + ' Generating…'; }

  try {
    const { url, revised } = await MockAI.generateImage(full, size);
    const img = { id: uid(), prompt, revised, url, size, style, createdAt: Date.now() };
    State.images.unshift(img);
    trackUsage(0, 0, 1);
    persist();
    results.firstElementChild?.remove();
    results.insertAdjacentHTML('afterbegin', genCard(img));
    wireImageActions();
    toast('Image generated', 'ok');
  } catch (e) {
    results.firstElementChild?.remove();
    toast(e.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = icon('sparkles',15) + ' Generate Image'; }
  }
}

function wireImageActions() {
  document.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => {
    const img = State.images.find(x => x.id === b.dataset.dl); if (!img) return;
    const a = document.createElement('a');
    a.href = img.url; a.download = `aislope-${img.id}.svg`; a.click();
    toast('Download started', 'ok');
  });
  document.querySelectorAll('[data-regen-img]').forEach(b => b.onclick = async () => {
    const img = State.images.find(x => x.id === b.dataset.regenImg); if (!img) return;
    const ta = document.getElementById('img-prompt');
    if (ta) ta.value = img.prompt;
    State.imgSize = img.size;
    navTo('images');
    await sleep(60);
    generateImage();
  });
}

async function runResearch() {
  const q = document.getElementById('research-q')?.value.trim();
  if (!q) { toast('Enter a research question', 'err'); return; }
  const out = document.getElementById('research-output');
  const btn = document.getElementById('research-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = icon('refresh',15) + ' Researching…'; }

  out.innerHTML = `<div class="research-report">
    <h2>Researching…</h2>
    <div class="rr-meta">Running multi-source analysis</div>
    <div class="rr-progress" id="rr-progress"></div>
  </div>`;

  const prog = document.getElementById('rr-progress');
  const abort = new AbortController();
  let done = 0, reportText = '';

  try {
    for await (const ev of MockAI.research(q, abort.signal)) {
      if (ev.type === 'step') {
        const prev = prog.querySelector('.rr-step.active');
        if (prev) { prev.classList.remove('active'); prev.classList.add('done'); prev.querySelector('.rs-ic').innerHTML = icon('check',12); }
        prog.insertAdjacentHTML('beforeend',
          `<div class="rr-step active"><span class="rs-ic">${icon('clock',12)}</span><span>${esc(ev.text)}</span></div>`);
      } else if (ev.type === 'delta') {
        reportText += ev.text;
      }
    }
    prog.querySelector('.rr-step.active')?.classList.add('done');
    prog.querySelector('.rr-step.active .rs-ic') && (prog.querySelector('.rr-step.active .rs-ic').innerHTML = icon('check',12));

    out.innerHTML = `<div class="research-report">
      <div class="rr-meta" style="margin-bottom:16px">${icon('compass',12)} Query: ${esc(q)} · 24 sources · High confidence</div>
      <div class="msg-content">${renderMarkdown(reportText)}</div>
      <div style="display:flex;gap:8px;margin-top:22px">
        <button class="btn btn-sm" id="rr-copy">${icon('copy',13)} Copy report</button>
        <button class="btn btn-sm" id="rr-newchat">${icon('chat',13)} Discuss in chat</button>
      </div>
    </div>`;

    document.getElementById('rr-copy')?.addEventListener('click', () => {
      navigator.clipboard.writeText(reportText); toast('Report copied', 'ok');
    });
    document.getElementById('rr-newchat')?.addEventListener('click', () => {
      const c = newConversation();
      c.messages.push({ id:uid(), role:'user', content:`Let's discuss this research:\n\n${q}`, createdAt:Date.now() });
      c.messages.push({ id:uid(), role:'assistant', content:reportText, createdAt:Date.now(), model:State.model });
      c.title = 'Research: ' + q.slice(0, 30);
      touchConv(c);
      navTo('chat');
    });
    trackUsage(1, 1200);
  } catch (e) {
    if (e.name !== 'AbortError') toast('Research failed', 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = icon('compass',15) + ' Start Research'; }
  }
}

function startQuiz() {
  const area = document.getElementById('quiz-area');
  if (!area) return;
  const qs = [
    { q:'Which law states that energy cannot be created or destroyed?', a:['Newton\'s First Law','Conservation of Energy','Ohm\'s Law','Boyle\'s Law'], c:1 },
    { q:'What is the derivative of x²?', a:['x','2x','x²','2'], c:1 },
    { q:'The powerhouse of the cell is the…', a:['Nucleus','Ribosome','Mitochondria','Vacuole'], c:2 },
    { q:'What does HTML stand for?', a:['Hyper Text Markup Language','High Tech Modern Language','Hyperlink Text Mode Language','Home Tool Markup Language'], c:0 },
    { q:'Water boils at what temperature at sea level?', a:['90°C','100°C','110°C','120°C'], c:1 },
  ];
  let answers = {}, submitted = false;

  function paint() {
    area.innerHTML = `<div class="panel"><div class="panel-body" style="padding:22px 18px">
      ${qs.map((q, i) => `
        <div style="margin-bottom:20px">
          <div style="font-size:13.5px;font-weight:650;margin-bottom:10px">${i+1}. ${esc(q.q)}</div>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${q.a.map((opt, j) => {
              const sel = answers[i] === j;
              let style = '';
              if (submitted) {
                if (j === q.c) style = 'background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4)';
                else if (sel) style = 'background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4)';
              } else if (sel) style = 'background:var(--accent-soft);border-color:var(--accent)';
              return `<button class="dd-item" data-ans="${i}:${j}" style="border:1px solid var(--border);${style}">
                <span class="source-num">${String.fromCharCode(65+j)}</span>
                <span style="font-size:13px">${esc(opt)}</span>
                ${submitted && j === q.c ? `<span style="margin-left:auto;color:var(--success)">${icon('check',14)}</span>` : ''}
              </button>`;
            }).join('')}
          </div>
        </div>`).join('')}
      <div style="display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:16px">
        <button class="btn" id="quiz-reset">Reset</button>
        <button class="btn btn-primary" id="quiz-submit" ${Object.keys(answers).length < qs.length || submitted ? 'disabled' : ''}>
          ${submitted ? 'Completed' : 'Submit Answers'}
        </button>
      </div>
      ${submitted ? `<div style="margin-top:16px;padding:14px;border-radius:12px;background:var(--accent-soft);text-align:center">
        <div style="font-size:22px;font-weight:750">${Object.entries(answers).filter(([k,v]) => v === qs[k].c).length} / ${qs.length}</div>
        <div style="font-size:12.5px;color:var(--text-2);margin-top:4px">Correct answers</div>
      </div>` : ''}
    </div></div>`;

    area.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => {
      if (submitted) return;
      const [i, j] = b.dataset.ans.split(':').map(Number);
      answers[i] = j; paint();
    });
    area.querySelector('#quiz-submit')?.addEventListener('click', () => { submitted = true; paint(); });
    area.querySelector('#quiz-reset')?.addEventListener('click', () => { answers = {}; submitted = false; paint(); });
  }
  paint();
}

    navTo('chat');
  });

  // New chat buttons
  document.querySelectorAll('[data-new-chat]').forEach(b => b.onclick = () => createAndOpenChat());

  document.querySelector('[data-new-project]')?.addEventListener('click', () => openProjectModal());

      conversations: State.conversations, projects: State.projects,

    document.querySelectorAll('[data-atab]').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('admin-body').innerHTML = renderAdminBody(State.adminTab);
  });
}

/* ============================ 16. MODALS ============================ */
function openModal(title, bodyHtml, onConfirm, confirmLabel = 'Save') {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay">
    <div class="modal">
      <h3>${esc(title)}</h3>
      <div style="margin-top:14px">${bodyHtml}</div>
      <div class="modal-actions">
        <button class="btn" data-cancel>Cancel</button>
        <button class="btn btn-primary" data-confirm>${esc(confirmLabel)}</button>
      </div>
    </div>
  </div>`;
  const close = () => root.innerHTML = '';
  root.querySelector('[data-cancel]').onclick = close;
  root.querySelector('.modal-overlay').onclick = e => { if (e.target.classList.contains('modal-overlay')) close(); };
  root.querySelector('[data-confirm]').onclick = () => {
    if (onConfirm && onConfirm() === false) return;
    close();
  };
  setTimeout(() => root.querySelector('input,textarea')?.focus(), 40);
}

function confirmModal(title, msg, onYes) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay">
    <div class="modal">
      <h3>${esc(title)}</h3>
      <p>${esc(msg)}</p>
      <div class="modal-actions">
        <button class="btn" data-cancel>Cancel</button>
        <button class="btn btn-danger" data-yes>Confirm</button>
      </div>
    </div>
  </div>`;
  root.querySelector('[data-cancel]').onclick = () => root.innerHTML = '';
  root.querySelector('.modal-overlay').onclick = e => { if (e.target.classList.contains('modal-overlay')) root.innerHTML = ''; };
  root.querySelector('[data-yes]').onclick = () => { root.innerHTML = ''; onYes(); };
}

function openProjectModal(id) {

  openModal(p ? 'Edit project' : 'New project', `
    <div class="field"><label>Project name</label><input class="input" id="pj-name" value="${p ? esc(p.name) : ''}" placeholder="Research paper"></div>
    <div class="field"><label>Instructions</label><textarea class="input" id="pj-ins" rows="4" style="resize:vertical;font-family:var(--font)" placeholder="How should the AI behave in this project?">${p ? esc(p.instructions || '') : ''}</textarea></div>

/* ============================ 17. AUTH ============================ */
let authMode = 'login';

function showAuth() {
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('app').classList.remove('on');
}
function showApp() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.add('on');
  if (!State.currentConv && State.conversations.length) State.currentConv = State.conversations[0].id;
  renderSidebar(); renderView();
}

function setAuthMode(mode) {
  authMode = mode;
  const title = document.getElementById('auth-title');
  const sub = document.getElementById('auth-sub');
  const btn = document.getElementById('auth-submit');
  const nameField = document.getElementById('name-field');
  const switchText = document.getElementById('auth-switch-text');
  const switchBtn = document.getElementById('auth-switch-btn');
  const pass = document.getElementById('auth-pass');

  if (mode === 'signup') {
    title.textContent = 'Create your account';
    sub.textContent = 'Start building with AI SLOPE in seconds.';
    btn.textContent = 'Create Account';
    nameField.style.display = '';
    switchText.textContent = 'Already have an account?';
    switchBtn.textContent = 'Sign in';
    pass.autocomplete = 'new-password';
  } else {
    title.textContent = 'Welcome back';
    sub.textContent = 'Sign in to continue to your AI workspace.';
    btn.textContent = 'Sign In';
    nameField.style.display = 'none';
    switchText.textContent = "Don't have an account?";
    switchBtn.textContent = 'Sign up';
    pass.autocomplete = 'current-password';
  }
  document.getElementById('auth-err').classList.remove('show');
}

function authError(msg) {
  const e = document.getElementById('auth-err');
  e.textContent = msg; e.classList.add('show');
}

async function handleAuthSubmit() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const name = document.getElementById('auth-name').value.trim();
  const btn = document.getElementById('auth-submit');

  if (!/^\S+@\S+\.\S+$/.test(email)) return authError('Please enter a valid email address.');
  if (pass.length < 6) return authError('Password must be at least 6 characters.');
  if (authMode === 'signup' && !name) return authError('Please enter your full name.');

  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = 'Please wait…';
  await sleep(700);

  // NOTE: Replace with POST /api/auth/{login|signup}
  const user = {
    id: uid(),
    name: authMode === 'signup' ? name : (email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase())),
    email,
    role: email.toLowerCase().includes('admin') ? 'admin' : 'user',
    plan: 'Free',
    createdAt: Date.now()
  };
  State.user = user;
  DB.set('user', user);
  btn.disabled = false;
  btn.textContent = orig;
  bootUser();
  toast(`Welcome, ${user.name.split(' ')[0]}!`, 'ok');
}

function loginAsDemo(role = 'user') {
  State.user = {
    id: uid(), name: role === 'admin' ? 'Admin User' : 'Demo User',
    email: role === 'admin' ? 'admin@aislope.ai' : 'demo@aislope.ai',
    role, plan: role === 'admin' ? 'Enterprise' : 'Pro', createdAt: Date.now()
  };
  DB.set('user', State.user);
  bootUser();
  toast(`Signed in as ${State.user.name}`, 'ok');
}

function logout() {
  confirmModal('Sign out?', 'You will be returned to the login screen.', () => {
    DB.del('user');
    State.user = null;
    showAuth();
    toast('Signed out');
  });
}

function bootUser() {
  const u = State.user;
  document.getElementById('user-name').textContent = u.name;
  document.getElementById('user-plan').textContent = `${u.plan} Plan`;
  document.getElementById('user-avatar').textContent = (u.name[0] || 'U').toUpperCase();
  showApp();
}

/* ============================ 18. THEME / SETTINGS ============================ */
function applySettings() {
  const s = State.settings;
  let theme = s.theme;
  if (theme === 'system') {
    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.setProperty('--fs', s.fontSize + 'px');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#08080d' : '#f6f6fa');
}
