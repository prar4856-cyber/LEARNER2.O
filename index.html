<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodePlayground — HTML • CSS • JS • JSON • XML • Markdown</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#0b0e1a;color:#e6e8f0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0b0e1a}
::-webkit-scrollbar-thumb{background:#2a3255;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3a4478}
.view{position:fixed;inset:0;display:flex;flex-direction:column}
[hidden]{display:none !important}
.spacer{flex:1}

.btn{padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:500;background:#1d2440;border:1px solid #2c3355;color:#d8ddff;transition:.15s}
.btn:hover{background:#273058;border-color:#3a4478}
.btn.primary{background:#4f46e5;border-color:#4f46e5;color:#fff;font-weight:600}
.btn.primary:hover{background:#4338ca}
.btn.ghost{background:transparent;border-color:#2c3355}
.btn.danger{color:#ff7b72;border-color:#4a2a33}
.btn.danger:hover{background:#2a1720}
.btn.sm{padding:5px 11px;font-size:12px}

/* ---------- LOGIN ---------- */
#view-login{align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#1b2350 0%,#0b0e1a 60%);overflow:auto;padding:20px}
.login-card{width:100%;max-width:400px;background:#121729;border:1px solid #232a45;border-radius:18px;padding:32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.brand{text-align:center;margin-bottom:26px}
.brand .logo{font-size:38px;line-height:1}
.brand h1{margin:10px 0 4px;font-size:22px;letter-spacing:.3px}
.brand h1 span{color:#7c8cff}
.brand p{margin:0;font-size:13px;color:#7b84ab}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:#8a93b8;margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:11px 14px;border-radius:10px;background:#0b0e1a;border:1px solid #2a3255;color:#e6e8f0;font-size:14px;outline:none;transition:.15s}
.field input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.18)}
.login-actions{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.login-actions .btn{padding:11px;font-size:14px;width:100%}
.switch-line{text-align:center;font-size:13px;color:#7b84ab;margin-top:16px}
.switch-line a{color:#7c8cff;cursor:pointer;font-weight:600;text-decoration:none}
.switch-line a:hover{text-decoration:underline}
.msg{font-size:13px;padding:9px 12px;border-radius:9px;margin-bottom:12px;display:none}
.msg.show{display:block}
.msg.err{background:#2a1720;color:#ff9b93;border:1px solid #4a2a33}
.msg.ok{background:#12291d;color:#7ee2a8;border:1px solid #1f4a33}
.msg.info{background:#0d1f33;color:#79c0ff;border:1px solid #1e3a5f}
.demo-note{margin-top:18px;font-size:11.5px;color:#5d6689;text-align:center;line-height:1.6;border-top:1px solid #1b2138;padding-top:14px}

/* ---------- DASHBOARD ---------- */
.dash-top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#121729;border-bottom:1px solid #232a45;flex-shrink:0;flex-wrap:wrap}
.dash-top h1{margin:0;font-size:16px;font-weight:600}
.dash-top h1 span{color:#7c8cff}
.user-chip{display:flex;align-items:center;gap:8px;background:#1a2038;border:1px solid #2a3255;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#4f46e5,#7c3aed);font-size:12px;font-weight:700;color:#fff}
.dash-body{flex:1;overflow-y:auto;padding:22px 20px 60px}
.group{margin-bottom:30px}
.group-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.group-head h2{margin:0;font-size:14px;color:#a9b1d6;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.group-head .line{flex:1;height:1px;background:linear-gradient(90deg,#232a45,transparent)}
.group-head .count{font-size:11px;background:#1d2440;border:1px solid #2c3355;color:#7b84ab;padding:2px 8px;border-radius:999px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:#121729;border:1px solid #232a45;border-radius:14px;padding:16px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;opacity:0;transition:.18s;background:radial-gradient(300px 120px at 50% 0%,rgba(79,70,229,.22),transparent 70%)}
.card:hover{transform:translateY(-3px);border-color:#3a4478}
.card:hover::before{opacity:1}
.card .ico{font-size:26px;line-height:1;position:relative}
.card .nm{margin-top:10px;font-size:14.5px;font-weight:600;position:relative}
.card .ds{margin-top:4px;font-size:11.5px;color:#7b84ab;line-height:1.4;position:relative}
.card .badge{position:absolute;top:12px;right:12px;font-size:9.5px;padding:2px 7px;border-radius:999px;background:#12291d;color:#7ee2a8;border:1px solid #1f4a33;font-weight:600;letter-spacing:.3px}
.card .saved{position:absolute;bottom:10px;right:12px;font-size:10px;color:#4f5a80}

/* ---------- EDITOR ---------- */
.ed-top{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#121729;border-bottom:1px solid #232a45;flex-shrink:0;flex-wrap:wrap}
.ed-top .title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ed-top .title .ico{font-size:16px}
#edBack{width:32px;height:32px;border-radius:9px;background:#1d2440;border:1px solid #2c3355;display:grid;place-items:center;font-size:15px}
#edBack:hover{background:#273058}
.save-status{font-size:11.5px;color:#5d6689;transition:.2s}
.save-status.on{color:#7ee2a8}
.ed-tabs{display:flex;gap:4px;padding:7px 12px 0;background:#151a2e;border-bottom:1px solid #232a45;flex-shrink:0;overflow-x:auto}
.ed-tabs .tab{padding:6px 15px;font-size:12.5px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;color:#8a93b8;white-space:nowrap}
.ed-tabs .tab:hover{color:#cfd5f5}
.ed-tabs .tab.active{background:#0b0e1a;border-color:#232a45;color:#fff}
.ed-tabs .tab.active[data-f="html"]{color:#ff7b72}
.ed-tabs .tab.active[data-f="css"]{color:#79c0ff}
.ed-tabs .tab.active[data-f="js"]{color:#ffd866}
.ed-tabs .tab.active[data-f="code"]{color:#a5d6ff}
.ed-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#232a45}
.ed-pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:#0b0e1a}
#edArea{flex:1;width:100%;resize:none;border:0;outline:none;padding:16px;background:#0b0e1a;color:#d8e0ff;font-family:"Consolas","Fira Code",monospace;font-size:14px;line-height:1.65;tab-size:2}
.out-head{display:flex;align-items:center;gap:7px;padding:7px 12px;flex-shrink:0;background:#151a2e;border-bottom:1px solid #232a45;font-size:12px;color:#8a93b8}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
.out-head .mini{font-size:11px;padding:3px 9px;border-radius:6px;background:#1d2440;border:1px solid #2c3355;color:#a9b1d6}
.out-head .mini:hover{background:#273058}
#edOut{flex:1;width:100%;border:0;background:#fff;min-height:0}
.console{height:150px;border-top:1px solid #232a45;background:#080b14;display:flex;flex-direction:column;flex-shrink:0}
.console-head{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:11.5px;color:#6f79a3;border-bottom:1px solid #1b2138;background:#101528;flex-shrink:0}
.console-head button{font-size:11px;padding:2px 9px;border-radius:6px;background:#1d2440;border:1px solid #2c3355;margin-left:auto}
.console-head button:hover{background:#273058}
.logs{flex:1;overflow-y:auto;padding:5px 12px;font-family:Consolas,monospace;font-size:12.5px;line-height:1.55}
.log{padding:2px 0;white-space:pre-wrap;word-break:break-word;border-bottom:1px solid #101528}
.log.log{color:#9fe8b0}.log.warn{color:#ffd866}.log.error{color:#ff7b72}
.log.info{color:#79c0ff}.log.sys{color:#5d6689;font-style:italic}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);background:#1d2440;border:1px solid #3a4478;color:#e6e8f0;padding:11px 20px;border-radius:11px;font-size:13.5px;z-index:200;opacity:0;transition:.28s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:#1f4a33;background:#12291d;color:#7ee2a8}
#toast.err{border-color:#4a2a33;background:#2a1720;color:#ff9b93}

@media (max-width:900px){
  .ed-body{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .console{height:100px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
  .dash-body{padding:16px 14px 60px}
  .dash-top{padding:10px 14px;gap:8px}
  .dash-top h1{font-size:14px}
  .user-chip{padding:4px 5px 4px 9px;font-size:12px}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="view-login" class="view">
  <div class="login-card">
    <div class="brand">
      <div class="logo">⚡</div>
      <h1>Code<span>Playground</span></h1>
      <p>HTML • CSS • JS • JSON • XML • Markdown</p>
    </div>
    <div id="loginMsg" class="msg"></div>
    <div class="field">
      <label for="inEmail">Email</label>
      <input id="inEmail" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="inPass">Password</label>
      <input id="inPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="field" id="wrapConfirm" hidden>
      <label for="inPass2">Confirm Password</label>
      <input id="inPass2" type="password" placeholder="••••••••">
    </div>
    <div class="login-actions">
      <button id="btnAuth" class="btn primary">Login</button>
      <button id="btnGuest" class="btn ghost">👤 Guest ke roop mein aage badho</button>
    </div>
    <div class="switch-line">
      <span id="switchText">Naya account?</span>
      <a id="switchLink">Sign Up</a>
    </div>
    <div class="demo-note">
      🔒 Supabase optional — Guest mode hamesha kaam karega.<br>
      Data browser mein save hota hai.
    </div>
  </div>
</section>

<!-- ============ DASHBOARD ============ -->
<section id="view-dash" class="view" hidden>
  <div class="dash-top">
    <h1>⚡ Code<span>Playground</span></h1>
    <div class="spacer"></div>
    <div class="user-chip">
      <span class="avatar" id="avatar">U</span>
      <span id="uname">user</span>
      <button id="btnLogout" class="btn danger sm" style="margin-left:4px">Logout</button>
    </div>
  </div>
  <div class="dash-body" id="dashBody"></div>
</section>

<!-- ============ EDITOR ============ -->
<section id="view-editor" class="view" hidden>
  <div class="ed-top">
    <button id="edBack" title="Wapas">←</button>
    <div class="title"><span class="ico" id="edIco">🚀</span><span id="edTitle">Project</span></div>
    <div class="spacer"></div>
    <span class="save-status" id="edSave">Saved</span>
    <button id="edShare" class="btn">🔗 Share</button>
    <button id="edRun" class="btn primary">▶ Run</button>
  </div>
  <div class="ed-tabs" id="edTabs"></div>
  <div class="ed-body">
    <div class="ed-pane">
      <textarea id="edArea" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <div class="ed-pane">
      <div class="out-head">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span style="margin-left:5px">Output</span>
        <div class="spacer"></div>
        <button class="mini" id="outFull">⛶ Full</button>
      </div>
      <iframe id="edOut" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-pointer-lock"></iframe>
      <div class="console">
        <div class="console-head"><span>Console</span><button id="edClear">Clear</button></div>
        <div class="logs" id="edLogs"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ PREVIEW ============ -->
<section id="view-preview" class="view" hidden>
  <button id="pvClose" title="Band karo" style="position:fixed;top:12px;right:12px;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(15,18,32,.85);color:#fff;font-size:16px;display:grid;place-items:center;backdrop-filter:blur(6px);box-shadow:0 4px 16px rgba(0,0,0,.3)">✕</button>
  <iframe id="pvFrame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-pointer-lock" style="flex:1;width:100%;border:0"></iframe>
</section>

<div id="toast"></div>

<script>
/* =========================================================
   CONFIG — Supabase (optional)
   ========================================================= */
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
let supabase = null, supabaseLoading = null;
let currentUser = null, isGuest = false;

/* =========================================================
   HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, type){
  const t = $('toast'); if (!t) return;
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = 'toast'; }, 3000);
}

function b64enc(str){
  return btoa(unescape(encodeURIComponent(str)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while (str.length % 4) str += '=';
  return decodeURIComponent(escape(atob(str)));
}
function withTimeout(p, ms, label){
  return Promise.race([
    p,
    new Promise((_,rej) => setTimeout(() => rej(new Error((label||'Operation')+' timeout')), ms))
  ]);
}

/* Local storage fallback (private mode support) */
const MEM = {};
let lsOK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ lsOK = false; }

function sGet(k){ try{ if(lsOK) return localStorage.getItem(k); }catch(e){lsOK=false;} return MEM[k] || null; }
function sSet(k,v){ try{ if(lsOK){localStorage.setItem(k,String(v));return;} }catch(e){lsOK=false;} MEM[k]=String(v); }
function sDel(k){ try{ if(lsOK){localStorage.removeItem(k);return;} }catch(e){lsOK=false;} delete MEM[k]; }

/* =========================================================
   LANGUAGES — 7 options, sab browser mein
   ========================================================= */
const LANGUAGES = [
  /* ---- Web Project (multi-file) ---- */
  {
    id: 'web', name: 'Web Project', icon: '🚀', group: 'Web — Saath Mein',
    desc: 'HTML + CSS + JS ek project',
    type: 'multi', files: ['html','css','js'],
    default: {
      html: '<h1>Hello Duniya! 👋</h1>\n<p>Yahan apna code likho, phir <b>Run</b> dabao.</p>\n<button onclick="greet()">Click Karo</button>',
      css: 'body {\n  font-family: sans-serif;\n  text-align: center;\n  padding: 40px;\n  background: #f4f6ff;\n  color: #1f2340;\n}\nh1 { color: #4f46e5; }\nbutton {\n  padding: 10px 22px;\n  border: 0;\n  border-radius: 8px;\n  background: #4f46e5;\n  color: #fff;\n  font-size: 15px;\n  cursor: pointer;\n}\nbutton:hover { background: #4338ca; }',
      js: 'console.log("Playground ready! 🚀");\n\nfunction greet() {\n  alert("Namaste! 🙏");\n  console.log("Button click hua");\n}'
    }
  },

  /* ---- Single-language options ---- */
  {
    id: 'html', name: 'HTML', icon: '🌐', group: 'Frontend',
    type: 'single', lang: 'html', desc: 'Web ka dhancha',
    default: { code: '<h1>Mera Page</h1>\n<p>Ye HTML preview hai.</p>\n\n<ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n</ul>\n\n<a href="https://google.com" target="_blank">Link</a>' }
  },
  {
    id: 'css', name: 'CSS', icon: '🎨', group: 'Frontend',
    type: 'single', lang: 'css', desc: 'Design & style',
    default: { code: 'body {\n  font-family: sans-serif;\n  padding: 40px;\n  background: #fff7f0;\n  color: #3a2418;\n}\nh1 { color: #e8590c; }\nbutton {\n  padding: 10px 20px;\n  border: 0;\n  border-radius: 8px;\n  background: #e8590c;\n  color: #fff;\n  cursor: pointer;\n  font-size: 14px;\n}\nbutton:hover { background: #c94a08; }\n.box {\n  margin-top: 20px;\n  padding: 20px;\n  background: #ffe8d6;\n  border-radius: 12px;\n  border-left: 4px solid #e8590c;\n}' }
  },
  {
    id: 'js', name: 'JavaScript', icon: '⚡', group: 'Frontend',
    type: 'single', lang: 'js', desc: 'Logic & interactivity',
    default: { code: 'console.log("Hello from JavaScript!");\n\nconst nums = [1, 2, 3, 4, 5];\nconst sum = nums.reduce((a, b) => a + b, 0);\nconsole.log("Sum =", sum);\nconsole.log("Squares =", nums.map(x => x * x));\n\ndocument.body.innerHTML =\n  "<h1>JS Chal Raha Hai ✅</h1>" +\n  "<p>Sum = " + sum + "</p>" +\n  "<p>Squares = " + nums.map(x => x*x).join(", ") + "</p>";' }
  },

  /* ---- Data & Markup ---- */
  {
    id: 'json', name: 'JSON', icon: '📦', group: 'Data & Markup',
    type: 'single', lang: 'json', desc: 'Data format validator',
    default: { code: '{\n  "name": "CodePlayground",\n  "version": 1,\n  "features": ["edit", "save", "run", "share"],\n  "active": true,\n  "author": {\n    "name": "Aap",\n    "city": "India"\n  }\n}' }
  },
  {
    id: 'xml', name: 'XML', icon: '📄', group: 'Data & Markup',
    type: 'single', lang: 'xml', desc: 'Markup language',
    default: { code: '<?xml version="1.0" encoding="UTF-8"?>\n<note>\n  <to>Duniya</to>\n  <from>CodePlayground</from>\n  <subject>Namaste!</subject>\n  <items>\n    <item id="1">Pehla</item>\n    <item id="2">Dusra</item>\n    <item id="3">Teesra</item>\n  </items>\n</note>' }
  },
  {
    id: 'markdown', name: 'Markdown', icon: '📝', group: 'Data & Markup',
    type: 'single', lang: 'markdown', desc: 'Docs & README',
    default: { code: '# Mera Document\n\nYe **Markdown** hai. Yahan *italic* aur `code` likh sakte ho.\n\n## Features\n\n- List item 1\n- List item 2\n- List item 3\n\n### Code Example\n\n```\nconsole.log("Hello World");\n```\n\n[Google link](https://google.com)' }
  }
];

function getLang(id){ return LANGUAGES.find(l => l.id === id); }

/* =========================================================
   SUPABASE (optional — lazy load)
   ========================================================= */
function isSupabaseConfigured(){
  return SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY';
}
function loadSupabaseSDK(){
  if (window.supabase && window.supabase.createClient) return Promise.resolve(window.supabase);
  if (supabaseLoading) return supabaseLoading;
  supabaseLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.async = true;
    const timer = setTimeout(() => reject(new Error('Supabase timeout')), 10000);
    s.onload = () => { clearTimeout(timer); resolve(window.supabase); };
    s.onerror = () => { clearTimeout(timer); reject(new Error('Supabase load failed')); };
    document.head.appendChild(s);
  });
  return supabaseLoading;
}
async function getSupabaseClient(){
  if (supabase) return supabase;
  if (!isSupabaseConfigured()) return null;
  try {
    await loadSupabaseSDK();
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return supabase;
  } catch(e){ console.warn('Supabase:', e.message); return null; }
}

/* =========================================================
   AUTH
   ========================================================= */
let authMode = 'login';

function setAuthMode(mode){
  authMode = mode;
  const isSignup = (mode === 'signup');
  $('wrapConfirm').hidden = !isSignup;
  $('btnAuth').textContent = isSignup ? 'Create Account' : 'Login';
  $('switchText').textContent = isSignup ? 'Pehle se account hai?' : 'Naya account?';
  $('switchLink').textContent = isSignup ? 'Login' : 'Sign Up';
  showMsg('');
}
function showMsg(text, type){
  const m = $('loginMsg');
  if (!text){ m.className = 'msg'; m.textContent = ''; return; }
  m.textContent = text;
  m.className = 'msg show ' + (type || 'err');
}

async function doAuth(){
  const email = $('inEmail').value.trim();
  const pass = $('inPass').value;
  const pass2 = $('inPass2').value;

  if (!email || !email.includes('@')) return showMsg('Valid email daalo.');
  if (!pass || pass.length < 6) return showMsg('Password kam se kam 6 character ka hona chahiye.');

  if (!isSupabaseConfigured()){
    return showMsg('Supabase configured nahi hai. Guest mode use karo →', 'info');
  }

  showMsg('Connecting to Supabase...', 'info');
  const client = await getSupabaseClient();
  if (!client) return showMsg('Supabase connect nahi hua. Guest mode try karo.', 'err');

  try {
    if (authMode === 'signup'){
      if (pass !== pass2) return showMsg('Dono passwords match nahi kar rahe.');
      const { data, error } = await client.auth.signUp({ email, password: pass });
      if (error) return showMsg(error.message);
      if (data.user && !data.session) return showMsg('✅ Email verify karo — inbox check karo!', 'ok');
      currentUser = data.user;
      toast('Account ban gaya! 🎉', 'ok');
      goTo('#/dashboard');
    } else {
      const { data, error } = await client.auth.signInWithPassword({ email, password: pass });
      if (error) return showMsg(error.message);
      currentUser = data.user;
      toast('Login ho gaya! 👋', 'ok');
      goTo('#/dashboard');
    }
  } catch(e){ showMsg('Error: ' + e.message); }
}

function doGuest(){
  isGuest = true;
  currentUser = null;
  sSet('cp_guest','1');
  toast('Guest mode active 🎉', 'ok');
  goTo('#/dashboard');
}

async function doLogout(){
  if (supabase && !isGuest && currentUser){
    try { await supabase.auth.signOut(); } catch(e){}
  }
  currentUser = null; isGuest = false;
  sDel('cp_guest');
  $('inEmail').value = ''; $('inPass').value = '';
  setAuthMode('login');
  goTo('');
  toast('Logout ho gaya');
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */
function localKey(){
  return isGuest ? 'cp_local' : ('cp_' + (currentUser?.id || 'u'));
}

async function saveProject(langId, files){
  // Local save (instant)
  let all = {};
  try { all = JSON.parse(sGet(localKey()) || '{}'); } catch(e){}
  all[langId] = { files, updated_at: Date.now() };
  sSet(localKey(), JSON.stringify(all));

  // Cloud save (background)
  if (!isGuest && currentUser && supabase){
    supabase.from('projects').upsert({
      user_id: currentUser.id,
      lang_id: langId,
      files: files,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,lang_id' }).then(() => {}, err => console.warn('Cloud save:', err.message));
  }
}

async function loadProject(langId){
  // Local first
  try {
    const all = JSON.parse(sGet(localKey()) || '{}');
    if (all[langId]?.files) return all[langId].files;
  } catch(e){}

  // Cloud
  if (!isGuest && currentUser && supabase){
    try {
      const { data } = await withTimeout(
        supabase.from('projects').select('files').eq('user_id', currentUser.id).eq('lang_id', langId).maybeSingle(),
        4000, 'Cloud load'
      );
      if (data?.files) return data.files;
    } catch(e){}
  }
  return null;
}

async function loadAllSaved(){
  let local = {};
  try { local = JSON.parse(sGet(localKey()) || '{}'); } catch(e){}

  if (!isGuest && currentUser && supabase){
    try {
      const { data } = await withTimeout(
        supabase.from('projects').select('lang_id, files, updated_at').eq('user_id', currentUser.id),
        4000, 'Cloud list'
      );
      (data || []).forEach(p => {
        local[p.lang_id] = { files: p.files, updated_at: new Date(p.updated_at).getTime() };
      });
    } catch(e){}
  }
  return local;
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function timeAgo(ts){
  if (!ts) return '';
  const d = Date.now() - ts;
  if (d < 60000) return 'abhi';
  if (d < 3600000) return Math.floor(d/60000) + 'm pehle';
  if (d < 86400000) return Math.floor(d/3600000) + 'h pehle';
  return Math.floor(d/86400000) + 'd pehle';
}

async function renderDash(){
  const uname = isGuest ? 'Guest' : (currentUser?.email?.split('@')[0] || 'user');
  $('uname').textContent = uname;
  $('avatar').textContent = uname.charAt(0).toUpperCase();

  // Paint immediately
  paintDash({});

  // Then load saved in background
  loadAllSaved().then(s => paintDash(s)).catch(() => {});
}

function paintDash(saved){
  const groups = [], map = {};
  LANGUAGES.forEach(l => {
    if (!map[l.group]){ map[l.group] = []; groups.push(l.group); }
    map[l.group].push(l);
  });

  let html = '';
  groups.forEach(g => {
    html += '<div class="group">';
    html += '<div class="group-head"><h2>' + esc(g) + '</h2>' +
            '<span class="count">' + map[g].length + '</span>' +
            '<span class="line"></span></div>';
    html += '<div class="cards">';

    map[g].forEach(l => {
      const isSaved = saved[l.id];
      html += '<div class="card" data-lang="' + l.id + '">' +
        '<div class="badge">RUN</div>' +
        '<div class="ico">' + l.icon + '</div>' +
        '<div class="nm">' + esc(l.name) + '</div>' +
        '<div class="ds">' + esc(l.desc || '') + '</div>' +
        (isSaved ? '<div class="saved">💾 ' + timeAgo(isSaved.updated_at) + '</div>' : '') +
        '</div>';
    });
    html += '</div></div>';
  });

  $('dashBody').innerHTML = html;
  $('dashBody').querySelectorAll('.card').forEach(c => {
    c.onclick = () => goTo('#/editor/' + c.dataset.lang);
  });
}

/* =========================================================
   EDITOR
   ========================================================= */
let ed = { langId: null, files: {}, activeFile: null };
let saveTimer = null;

async function openEditor(langId){
  const L = getLang(langId);
  if (!L){ goTo('#/dashboard'); return; }

  ed.langId = langId;
  ed.files = JSON.parse(JSON.stringify(L.default));
  ed.activeFile = L.files ? L.files[0] : 'code';

  $('edIco').textContent = L.icon;
  $('edTitle').textContent = L.name;
  $('edRun').style.display = '';

  renderEdTabs();
  $('edArea').value = ed.files[ed.activeFile] || '';
  setSaveStatus('Saved', false);
  $('edLogs').innerHTML = '';
  addLog('sys', '💡 Ctrl/Cmd + Enter = Run • Ctrl/Cmd + S = Save');

  // Auto-run on open
  $('edOut').srcdoc = buildOutput(langId, ed.files);

  showView('view-editor');

  // Load saved version in background
  loadProject(langId).then(saved => {
    if (saved && typeof saved === 'object' && ed.langId === langId){
      Object.keys(L.default).forEach(k => {
        if (typeof saved[k] === 'string') ed.files[k] = saved[k];
      });
      $('edArea').value = ed.files[ed.activeFile] || '';
      $('edOut').srcdoc = buildOutput(langId, ed.files);
    }
  }).catch(() => {});
}

function renderEdTabs(){
  const L = getLang(ed.langId);
  const box = $('edTabs');

  if (!L.files){
    box.innerHTML = '';
    box.style.display = 'none';
    return;
  }

  box.style.display = '';
  const labels = { html:'HTML', css:'CSS', js:'JS', code:'CODE' };
  box.innerHTML = L.files.map(f =>
    '<button class="tab' + (f === ed.activeFile ? ' active' : '') + '" data-f="' + f + '">' +
      (labels[f] || f.toUpperCase()) +
    '</button>'
  ).join('');

  box.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      ed.files[ed.activeFile] = $('edArea').value;
      ed.activeFile = t.dataset.f;
      $('edArea').value = ed.files[ed.activeFile] || '';
      renderEdTabs();
      $('edArea').focus();
    };
  });
}

function setSaveStatus(txt, ok){
  const el = $('edSave');
  el.textContent = txt;
  el.className = 'save-status' + (ok ? ' on' : '');
}

function addLog(type, text){
  const box = $('edLogs');
  const d = document.createElement('div');
  d.className = 'log ' + type;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function clearLogs(){ $('edLogs').innerHTML = ''; }

function scheduleSave(){
  setSaveStatus('Saving…', false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
}

function saveNow(){
  if (!getLang(ed.langId)) return;
  ed.files[ed.activeFile] = $('edArea').value;
  saveProject(ed.langId, ed.files);
  setSaveStatus('Saved ✓', true);
}

/* =========================================================
   RUN
   ========================================================= */
function runCode(){
  const L = getLang(ed.langId);
  if (!L) return;

  ed.files[ed.activeFile] = $('edArea').value;
  saveNow();

  clearLogs();
  addLog('sys', '▶ Running ' + L.name + '...');

  $('edOut').srcdoc = buildOutput(ed.langId, ed.files);
  addLog('sys', '✅ Render complete');
}

/* =========================================================
   OUTPUT BUILDERS
   ========================================================= */
const PAGE_CSS = `*{box-sizing:border-box}body{margin:0;padding:24px;font-family:system-ui,sans-serif;color:#1f2340;background:#fff;line-height:1.6}pre{background:#0d1117;color:#c9d1d9;border:1px solid #21262d;border-radius:10px;padding:18px;overflow:auto;font-family:Consolas,monospace;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}code{background:#f0f2fb;padding:2px 6px;border-radius:5px;font-family:Consolas,monospace;font-size:13px}.tag{display:inline-block;background:#eef1ff;color:#4f46e5;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;margin-bottom:14px}`;

function makeOutputPage(langName, output){
  const safeOut = String(output || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + PAGE_CSS + '</style></head><body>' +
    '<div class="tag">⚡ ' + esc(langName) + '</div><pre>' + safeOut + '</pre></body></html>';
}

const CONSOLE_HOOK = '<scr' + 'ipt>' + `
(function(){
  function send(type, args){
    var out = [];
    for (var i=0;i<args.length;i++){
      var a = args[i];
      try{
        if (a === null) out.push('null');
        else if (a === undefined) out.push('undefined');
        else if (typeof a === 'object') out.push(JSON.stringify(a, null, 1));
        else out.push(String(a));
      }catch(e){ out.push(String(a)); }
    }
    try{ parent.postMessage({__cp:true, type:type, args:out}, '*'); }catch(e){}
  }
  ['log','warn','error','info'].forEach(function(m){
    var orig = console[m];
    console[m] = function(){
      send(m, [].slice.call(arguments));
      if (orig) try{ orig.apply(console, arguments); }catch(e){}
    };
  });
  window.onerror = function(msg, src, line){
    send('error', ['❌ ' + msg + (line ? '  (line ' + line + ')' : '')]);
    return false;
  };
})();
` + '</scr' + 'ipt>';

function buildOutput(langId, files){
  const L = getLang(langId);
  const BASE = '*{box-sizing:border-box}body{margin:0;padding:24px;font-family:system-ui,sans-serif;color:#1f2340;background:#fff;line-height:1.6}';

  /* ---- Web Project (multi-file) ---- */
  if (L.type === 'multi'){
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + BASE + '\n' + (files.css || '') + '</style></head><body>' +
      (files.html || '') + CONSOLE_HOOK +
      '<scr' + 'ipt>try{\n' + (files.js || '').replace(/<\/script>/gi, '<\\/script>') + '\n}catch(e){console.error("❌ " + e.message)}\n</scr' + 'ipt>' +
      '</body></html>';
  }

  const code = files.code || '';

  switch (L.lang){
    case 'html':
      return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + BASE + '</style></head><body>' + code + CONSOLE_HOOK + '</body></html>';

    case 'css':
      return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + BASE + '\n' + code + '</style></head><body>' +
        '<h1>CSS Preview</h1>' +
        '<p>Ye sample content hai — apna CSS upar likho.</p>' +
        '<button>Ek Button</button>' +
        '<div class="box">Ek Box</div>' +
        '<ul><li>Item One</li><li>Item Two</li></ul>' +
        '</body></html>';

    case 'js':
      return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + BASE + '</style></head><body>' +
        '<div id="app"></div>' + CONSOLE_HOOK +
        '<scr' + 'ipt>try{\n' + code.replace(/<\/script>/gi, '<\\/script>') + '\n}catch(e){console.error("❌ " + e.message)}\n</scr' + 'ipt>' +
        '</body></html>';

    case 'json': {
      try {
        const obj = JSON.parse(code);
        return makeOutputPage('JSON — Valid ✅', JSON.stringify(obj, null, 2));
      } catch(e){
        return makeOutputPage('JSON — Invalid ❌', e.message + '\n\n--- Aapka code ---\n' + code);
      }
    }

    case 'xml':
      return makeOutputPage('XML', code);

    case 'markdown': {
      let h = esc(code);

      // Fenced code blocks (must be before inline code)
      const blocks = [];
      h = h.replace(/```([\s\S]*?)```/g, (m, c) => {
        blocks.push('<pre>' + c.replace(/^\n/, '') + '</pre>');
        return '\u0000BLOCK' + (blocks.length - 1) + '\u0000';
      });

      // Headings
      h = h.replace(/^###### (.*)$/gm, '<h6>$1</h6>')
           .replace(/^##### (.*)$/gm,  '<h5>$1</h5>')
           .replace(/^#### (.*)$/gm,   '<h4>$1</h4>')
           .replace(/^### (.*)$/gm,    '<h3>$1</h3>')
           .replace(/^## (.*)$/gm,     '<h2>$1</h2>')
           .replace(/^# (.*)$/gm,      '<h1>$1</h1>');

      // Horizontal rule
      h = h.replace(/^---+$/gm, '<hr>');

      // Blockquote
      h = h.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');

      // Lists
      h = h.replace(/^\s*[-*+] (.*)$/gm, '<li>$1</li>');
      h = h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');

      // Inline
      h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
           .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<em>$2</em>')
           .replace(/`(.+?)`/g, '<code>$1</code>')
           .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      // Paragraphs
      h = h.split(/\n{2,}/).map(p => {
        const t = p.trim();
        if (!t) return '';
        if (/^<(h\d|ul|ol|pre|blockquote|hr|li)/.test(t)) return t;
        if (/^\u0000BLOCK/.test(t)) return t;
        return '<p>' + t.replace(/\n/g, '<br>') + '</p>';
      }).join('\n');

      // Restore blocks
      h = h.replace(/\u0000BLOCK(\d+)\u0000/g, (m, i) => blocks[+i] || '');

      return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + PAGE_CSS +
        'blockquote{border-left:4px solid #4f46e5;margin:12px 0;padding:6px 16px;background:#f7f8ff;color:#4a5270;border-radius:0 8px 8px 0}' +
        'a{color:#4f46e5}h1,h2,h3{border-bottom:1px solid #e0e4f5;padding-bottom:6px}' +
        '</style></head><body><div style="max-width:760px;margin:0 auto">' + h + '</div></body></html>';
    }

    default:
      return makeOutputPage(L.name, code);
  }
}

/* =========================================================
   SHARE
   ========================================================= */
async function doShare(){
  ed.files[ed.activeFile] = $('edArea').value;
  saveNow();

  const doc = buildOutput(ed.langId, ed.files);
  const url = location.href.split('#')[0] + '#preview=' + b64enc(doc);
  await copy(url);
  toast('🔗 Share link copied!', 'ok');
}

async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
}

/* =========================================================
   ROUTER
   ========================================================= */
function showView(id){
  ['view-login','view-dash','view-editor','view-preview'].forEach(v => {
    const el = $(v); if (el) el.hidden = (v !== id);
  });
}
function goTo(hash){
  try { if (location.hash !== hash) location.hash = hash; } catch(e){}
  route();
}
function route(){
  const hash = location.hash || '';

  if (hash.indexOf('#preview=') === 0){
    let doc = '';
    try { doc = b64dec(hash.slice(9)); }
    catch(e){ doc = '<h1 style="padding:40px;font-family:sans-serif">⚠️ Link kharab hai</h1>'; }
    $('pvFrame').srcdoc = doc;
    showView('view-preview');
    return;
  }

  if (!currentUser && !isGuest){
    showView('view-login');
    return;
  }

  const m = hash.match(/^#\/editor\/([a-zA-Z0-9_]+)/);
  if (m && getLang(m[1])){ openEditor(m[1]); return; }

  renderDash();
  showView('view-dash');
}

/* =========================================================
   WIRE EVENTS
   ========================================================= */
function wire(){
  $('switchLink').onclick = () => setAuthMode(authMode === 'login' ? 'signup' : 'login');
  $('btnAuth').onclick = doAuth;
  $('btnGuest').onclick = doGuest;
  $('btnLogout').onclick = doLogout;

  ['inEmail','inPass','inPass2'].forEach(id => {
    $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
  });

  $('edRun').onclick = runCode;
  $('edClear').onclick = clearLogs;
  $('edBack').onclick = () => { saveNow(); goTo('#/dashboard'); };
  $('edShare').onclick = doShare;

  $('outFull').onclick = () => {
    ed.files[ed.activeFile] = $('edArea').value;
    saveNow();
    const doc = buildOutput(ed.langId, ed.files);
    const w = window.open('', '_blank');
    if (w){ w.document.open(); w.document.write(doc); w.document.close(); }
  };

  const area = $('edArea');
  area.addEventListener('input', () => {
    ed.files[ed.activeFile] = area.value;
    scheduleSave();
  });
  area.addEventListener('keydown', e => {
    if (e.key === 'Tab'){
      e.preventDefault();
      const s = area.selectionStart;
      area.value = area.value.slice(0, s) + '  ' + area.value.slice(area.selectionEnd);
      area.selectionStart = area.selectionEnd = s + 2;
      ed.files[ed.activeFile] = area.value;
      scheduleSave();
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); runCode(); }
    if (e.key === 's' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); saveNow(); toast('Save 💾', 'ok'); }
  });

  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || !d.__cp) return;
    addLog(d.type === 'log' ? 'log' : d.type, d.args.join(' '));
  });

  $('pvClose').onclick = () => goTo('');
  window.addEventListener('hashchange', route);
}

/* =========================================================
   INIT — instant, kuch wait nahi
   ========================================================= */
function init(){
  wire();
  setAuthMode('login');

  // Check guest mode
  if (sGet('cp_guest') === '1') isGuest = true;

  // Route immediately
  route();

  // Background Supabase session check (never blocks)
  if (isSupabaseConfigured() && !isGuest){
    getSupabaseClient()
      .then(c => c ? withTimeout(c.auth.getSession(), 3000, 'Session') : null)
      .then(res => {
        if (res?.data?.session?.user){
          currentUser = res.data.session.user;
          $('inEmail').value = currentUser.email || '';
          if (!$('view-login').hidden) route();
        }
      })
      .catch(e => console.warn('Auth check:', e.message));
  }
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
