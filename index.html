  document.addEventListener('click', e => {
    const t = e.target.closest('#theme-btn');
    if (t) {
      const cur = State.settings.theme;
      State.settings.theme = cur === 'dark' ? 'light' : 'dark';
      applySettings(); persist(); renderTopbar();
    }
  });

  // Sidebar nav & chat items (delegation)
  document.getElementById('sidebar').addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { navTo(nav.dataset.nav); return; }

    const renameBtn = e.target.closest('[data-rename]');
    if (renameBtn) {
      e.stopPropagation();
      const c = getConv(renameBtn.dataset.rename);
      if (!c) return;
      openModal('Rename conversation', `<div class="field"><label>Title</label><input class="input" id="rn" value="${esc(c.title)}"></div>`, () => {
        const v = document.getElementById('rn')?.value.trim();
        if (!v) return false;
        c.title = v; persist(); renderSidebar(); toast('Renamed', 'ok');
      }, 'Rename');
      return;
    }

    const delBtn = e.target.closest('[data-delete]');
    if (delBtn) {
      e.stopPropagation();
      confirmModal('Delete conversation?', 'This action cannot be undone.', () => {
        deleteConversation(delBtn.dataset.delete);
        toast('Conversation deleted');
      });
      return;
    }

    const item = e.target.closest('[data-conv]');
    if (item) {
      State.currentConv = item.dataset.conv;
      State.currentView = 'chat';
      renderSidebar(); renderView();
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sb-overlay').classList.remove('on');
    }
  });

  // User menu
  document.getElementById('user-menu-btn')?.addEventListener('click', () => {
    const existing = document.querySelector('.user-dd');
    if (existing) { existing.remove(); return; }
    closeMenus();
    const dd = document.createElement('div');
    dd.className = 'dropdown user-dd';
    dd.style.cssText = 'bottom:calc(100% + 8px);top:auto;left:10px;right:10px;min-width:0';
    dd.innerHTML = `
      <div style="padding:10px 11px 12px;border-bottom:1px solid var(--border);margin-bottom:5px">
        <div style="font-size:13.5px;font-weight:650">${esc(State.user?.name || 'User')}</div>
        <div style="font-size:11.5px;color:var(--text-3)">${esc(State.user?.email || '')}</div>
      </div>
      <button class="dd-item" data-nav="settings">${icon('cog',15)} Settings</button>
      <button class="dd-item" data-nav="projects">${icon('folder',15)} Projects</button>
      ${State.user?.role === 'admin' ? `<button class="dd-item" data-nav="admin">${icon('shield',15)} Admin Panel</button>` : ''}
      <div class="dd-sep"></div>
      <button class="dd-item" id="dd-logout" style="color:#f87171">${icon('logout',15)} Sign out</button>
    `;
    document.querySelector('.sb-foot').style.position = 'relative';
    document.querySelector('.sb-foot').appendChild(dd);
    dd.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { dd.remove(); navTo(b.dataset.nav); });
    dd.querySelector('#dd-logout').onclick = () => { dd.remove(); logout(); };
    setTimeout(() => document.addEventListener('click', function h(ev) {
      if (!ev.target.closest('.user-dd') && !ev.target.closest('#user-menu-btn')) {
        dd.remove(); document.removeEventListener('click', h);
      }
    }), 0);
  });

  // Auth events
  document.getElementById('auth-switch-btn').onclick = () => setAuthMode(authMode === 'login' ? 'signup' : 'login');
  document.getElementById('auth-submit').onclick = handleAuthSubmit;
  document.getElementById('google-btn').onclick = () => {
    toast('Google OAuth — connect your client ID in the backend', 'err');
    // In production: window.location.href = '/api/auth/google';
  };
  document.getElementById('forgot-btn').onclick = () => {
    openModal('Reset password', `
      <p style="margin-bottom:16px;font-size:13.5px;color:var(--text-2)">Enter your email and we'll send a reset link.</p>
      <div class="field"><label>Email</label><input class="input" id="fp-email" type="email" placeholder="you@example.com"></div>
    `, () => {
      const e = document.getElementById('fp-email')?.value.trim();
      if (!/^\S+@\S+\.\S+$/.test(e)) { toast('Enter a valid email', 'err'); return false; }
      toast('Reset link sent (mock)', 'ok');
    }, 'Send link');
  };
  document.getElementById('auth-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAuthSubmit();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeMenus();
      if (State.generating) stopGeneration();
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('chat-search')?.focus();
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'b') {
      e.preventDefault();
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('open');
      document.getElementById('sb-overlay').classList.toggle('on', sb.classList.contains('open'));
    }
  });

  // System theme listener
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if (State.settings.theme === 'system') applySettings();
  });
}

/* ============================ 21. BOOTSTRAP ============================ */
function boot() {
  applySettings();
  wireGlobal();

  // Sync sidebar close button visibility
  const updateCloseBtn = () => {
    const btn = document.getElementById('close-sb');
    if (btn) btn.style.display = window.innerWidth <= 900 ? 'grid' : 'none';
  };
  updateCloseBtn();
  window.addEventListener('resize', updateCloseBtn);

  // Hide boot screen
  setTimeout(() => {
    document.getElementById('boot').classList.add('off');
    setTimeout(() => document.getElementById('boot').remove(), 450);
  }, 400);

  // Route
  if (State.user) {
    bootUser();
  } else {
    setAuthMode('login');
    showAuth();
  }
}

document.addEventListener('DOMContentLoaded', boot);

/* ============================================================================
   BACKEND ARCHITECTURE REFERENCE
   ----------------------------------------------------------------------------
   Directory layout (Node/Express or Next.js API routes):

   /server
     /api
       /auth        → POST /signup, /login, /logout, /google, /reset
       /chat        → POST (SSE stream) — proxies to model provider
       /images      → POST /generate, GET /history
       /research    → POST (SSE stream) — search + synthesis pipeline
       /files       → POST /upload, GET /:id, DELETE /:id
       /projects    → CRUD
       /admin       → users, analytics, models, features, logs (role-gated)
     /providers
       openai.js    → real provider implementing the same stream interface
       anthropic.js
       gemini.js
       mock.js      → this file's MockAI, server-side (fallback in dev)
     /db
       schema.sql   → users, conversations, messages, projects,
                      files, generated_images, settings, usage_events
     /middleware
       auth.js      → session/JWT verification
       rateLimit.js
     .env           → OPENAI_API_KEY, ANTHROPIC_API_KEY, DATABASE_URL,
                      SESSION_SECRET, IMAGE_API_KEY, SEARCH_API_KEY

   To connect a real provider, swap `MockAI.stream()` for a fetch to
   `/api/chat` reading the SSE response — the async-generator interface
   is identical, so no UI changes are required.
============================================================================ */
</script>
</body>
